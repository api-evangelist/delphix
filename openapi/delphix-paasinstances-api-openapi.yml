openapi: 3.0.0
info:
  title: Delphix DCT Algorithms PaaSInstances API
  version: 3.28.0
  description: Delphix DCT API
  contact:
    name: Delphix Support
    url: https://portal.perforce.com/s/
    email: support@delphix.com
servers:
- url: /dct/v3
security:
- ApiKeyAuth: []
tags:
- name: PaaSInstances
paths:
  /paas-instances:
    get:
      summary: List all PaaS Instances.
      operationId: get_paas_instances
      tags:
      - PaaSInstances
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/paaSInstanceSortParam'
      - $ref: '#/components/parameters/permission'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                title: ListPaaSInstancesResponse
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PaaSInstance'
                  response_metadata:
                    $ref: '#/components/schemas/PaginatedResponseMetadata'
    post:
      summary: Provision a new PaaS Instance
      operationId: provision_paas_instance
      tags:
      - PaaSInstances
      requestBody:
        content:
          application/json:
            schema:
              x-body-name: provision_paas_instance_parameter
              $ref: '#/components/schemas/ProvisionPaaSInstanceParameters'
        description: The parameters to provision a PaaS Instance.
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                title: ProvisionPaaSInstanceResponse
                properties:
                  instance_id:
                    type: string
                    description: The ID of the provisioned PaaS Instance.
                  job:
                    $ref: '#/components/schemas/Job'
  /paas-instances/search:
    post:
      summary: Search for PaaS Instances.
      operationId: search_paas_instances
      tags:
      - PaaSInstances
      x-filterable:
        fields:
          id:
            type: string
          name:
            type: string
          plugin_id:
            type: string
          cloud_account_id:
            type: string
          cloud_account_name:
            type: string
          database_engine:
            type: string
          database_engine_version:
            type: string
          status:
            type: string
          runtime_status:
            type: string
          parent_instance_id:
            type: string
          parent_snapshot_id:
            type: string
          is_encrypted:
            type: boolean
          database_type:
            type: string
          owner:
            type: string
          region:
            type: string
          availability_zone:
            type: string
          instance_type:
            type: string
          total_allocated_storage_gb:
            type: integer
          max_allocated_storage_gb:
            type: integer
          auto_scaling_enabled:
            type: boolean
          backup_window:
            type: string
          created_time:
            type: string
          root_instance_id:
            type: string
          size_bytes:
            type: integer
          size_measurement_time:
            type: string
          size_measurement_source:
            type: string
          compliance_profile_job_collection_id:
            type: string
          compliance_masking_job_collection_id:
            type: string
          masked_by_execution_id:
            type: string
          masked_by_collection_id:
            type: string
          tags:
            type: array[object]
            fields:
              key:
                type: string
              value:
                type: string
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/paaSInstanceSortParam'
      - $ref: '#/components/parameters/permission'
      requestBody:
        $ref: '#/components/requestBodies/SearchBody'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                title: SearchPaaSInstancesResponse
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PaaSInstance'
                  response_metadata:
                    $ref: '#/components/schemas/PaginatedResponseMetadata'
  /paas-instances/{paaSInstanceId}:
    parameters:
    - $ref: '#/components/parameters/paaSInstanceIdParam'
    get:
      summary: Get a PaaS Instance by ID.
      operationId: get_paas_instance_by_id
      tags:
      - PaaSInstances
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaaSInstance'
    patch:
      summary: Update a PaaS Instance.
      operationId: update_paas_instance
      tags:
      - PaaSInstances
      requestBody:
        content:
          application/json:
            schema:
              x-body-name: update_paas_instance_parameter
              $ref: '#/components/schemas/UpdatePaaSInstanceParameters'
        description: The parameters to update a PaaS Instance.
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                title: UpdatePaaSInstanceResponse
                properties:
                  job:
                    $ref: '#/components/schemas/Job'
  /paas-instances/{paaSInstanceId}/delete:
    post:
      summary: Delete a PaaS Instance
      operationId: delete_paas_instance
      tags:
      - PaaSInstances
      parameters:
      - $ref: '#/components/parameters/paaSInstanceIdParam'
      requestBody:
        content:
          application/json:
            schema:
              x-body-name: delete_paas_instance_parameter
              $ref: '#/components/schemas/DeletePaaSInstanceParameters'
        description: The parameters to delete a PaaS Instance.
        required: false
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                title: DeletePaaSInstanceResponse
                properties:
                  job:
                    $ref: '#/components/schemas/Job'
  /paas-instances/{paaSInstanceId}/refresh:
    parameters:
    - $ref: '#/components/parameters/paaSInstanceIdParam'
    post:
      summary: Refresh a PaaS Instance
      operationId: refresh_paas_instance
      tags:
      - PaaSInstances
      requestBody:
        content:
          application/json:
            schema:
              x-body-name: refresh_paas_instance_parameter
              $ref: '#/components/schemas/RefreshPaaSInstanceParameters'
        description: The parameters to refresh a PaaS Instance.
        required: true
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                title: RefreshPaaSInstanceResponse
                properties:
                  job:
                    $ref: '#/components/schemas/Job'
  /paas-instances/{paaSInstanceId}/tags:
    parameters:
    - $ref: '#/components/parameters/paaSInstanceIdParam'
    post:
      tags:
      - PaaSInstances
      summary: Create tags for a PaaS Instance.
      operationId: create_paas_instance_tags
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudTagsRequest'
        description: Tags information for PaaS Instance.
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudTagsResponse'
    get:
      tags:
      - PaaSInstances
      summary: Get tags for a PaaS Instance.
      operationId: get_paas_instance_tags
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudTagsResponse'
  /paas-instances/{paaSInstanceId}/tags/delete:
    parameters:
    - $ref: '#/components/parameters/paaSInstanceIdParam'
    post:
      tags:
      - PaaSInstances
      summary: Delete tags for a PaaS Instance.
      operationId: delete_paas_instance_tags
      requestBody:
        $ref: '#/components/requestBodies/DeleteCloudTags'
      responses:
        '204':
          description: No Content
  /paas-instances/provision_from_bookmark:
    post:
      summary: Provision a new PaaS Instance from a bookmark
      operationId: provision_paas_instance_from_bookmark
      tags:
      - PaaSInstances
      requestBody:
        content:
          application/json:
            schema:
              x-body-name: provision_paas_instance_from_bookmark_parameter
              $ref: '#/components/schemas/ProvisionPaaSInstanceFromBookmarkParameters'
        description: The parameters to provision a PaaS Instance from a bookmark.
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                title: ProvisionPaaSInstanceFromBookmarkResponse
                properties:
                  paas_instance_id:
                    type: string
                    description: The ID of the provisioned PaaS Instance.
                  job:
                    type: object
                    $ref: '#/components/schemas/Job'
  /paas-instances/{paaSInstanceId}/bookmarks:
    parameters:
    - $ref: '#/components/parameters/paaSInstanceIdParam'
    get:
      summary: List Bookmarks compatible with this PaaS Instance.
      operationId: get_bookmarks_by_paas_instance
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/bookmarksSortParam'
      tags:
      - PaaSInstances
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                title: ListBookmarksByPaaSInstanceResponse
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Bookmark'
                  response_metadata:
                    $ref: '#/components/schemas/PaginatedResponseMetadata'
  /paas-instances/{paaSInstanceId}/bookmarks/search:
    parameters:
    - $ref: '#/components/parameters/paaSInstanceIdParam'
    post:
      summary: Search Bookmarks compatible with this PaaS Instance.
      operationId: search_bookmarks_by_paas_instance
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/bookmarksSortParam'
      tags:
      - PaaSInstances
      x-filterable:
        fields:
          id:
            type: string
          name:
            type: string
          paas_instances:
            type: array[object]
            fields:
              paas_instance_id:
                type: string
              paas_instance_name:
                type: string
              paas_snapshot_id:
                type: string
              data_timestamp:
                type: date-time
          creation_date:
            type: date-time
          retention:
            type: integer
          expiration:
            type: date
          data_timestamp:
            type: date-time
          tags:
            type: array[object]
            fields:
              key:
                type: string
              value:
                type: string
      requestBody:
        $ref: '#/components/requestBodies/SearchBody'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                title: SearchBookmarksByPaaSInstanceResponse
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Bookmark'
                  response_metadata:
                    $ref: '#/components/schemas/PaginatedResponseMetadata'
  /paas-instances/{paaSInstanceId}/refresh_from_bookmark:
    parameters:
    - $ref: '#/components/parameters/paaSInstanceIdParam'
    post:
      summary: Refresh a PaaS Instance from a bookmark
      operationId: refresh_paas_instance_from_bookmark
      tags:
      - PaaSInstances
      requestBody:
        content:
          application/json:
            schema:
              x-body-name: refresh_paas_instance_from_bookmark_parameter
              $ref: '#/components/schemas/RefreshPaaSInstanceFromBookmarkParameters'
        description: The parameters to refresh a PaaS Instance from a bookmark.
        required: true
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                title: RefreshPaaSInstanceFromBookmarkResponse
                properties:
                  job:
                    $ref: '#/components/schemas/Job'
  /paas-instances/{paaSInstanceId}/de-provision:
    parameters:
    - $ref: '#/components/parameters/paaSInstanceIdParam'
    post:
      summary: De-provision a PaaS Instance, meaning that the instance object will remain in DCT, along with its permissions, tags, snapshots, ... but the instance will no longer be running. If the current instance data must be preserved, take a snapshot before de-provisioning.
      operationId: deprovision_paas_instance
      tags:
      - PaaSInstances
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                title: DeprovisionPaaSInstanceResponse
                properties:
                  job:
                    $ref: '#/components/schemas/Job'
  /paas-instances/{paaSInstanceId}/re-provision:
    parameters:
    - $ref: '#/components/parameters/paaSInstanceIdParam'
    post:
      summary: Re-provision a PaaS Instance which has previously been de-provisioned. The provision parameters specified at provisioning time will be respected, with the exception of the timestamp or snapshot id to re-provision from.
      operationId: reprovision_paas_instance
      tags:
      - PaaSInstances
      requestBody:
        content:
          application/json:
            schema:
              x-body-name: reprovision_paas_instance_parameter
              $ref: '#/components/schemas/ReProvisionPaaSInstanceParameters'
        description: The parameters to re-provision a PaaS Instance.
        required: true
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                title: ReprovisionPaaSInstanceResponse
                properties:
                  job:
                    $ref: '#/components/schemas/Job'
  /paas-instances/{paaSInstanceId}/start:
    parameters:
    - $ref: '#/components/parameters/paaSInstanceIdParam'
    post:
      summary: Start a PaaS Instance
      operationId: start_paas_instance
      tags:
      - PaaSInstances
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                title: StartPaaSInstanceResponse
                properties:
                  job:
                    $ref: '#/components/schemas/Job'
  /paas-instances/{paaSInstanceId}/stop:
    parameters:
    - $ref: '#/components/parameters/paaSInstanceIdParam'
    post:
      summary: Stop a PaaS Instance
      operationId: stop_paas_instance
      tags:
      - PaaSInstances
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                title: StopPaaSInstanceResponse
                properties:
                  job:
                    $ref: '#/components/schemas/Job'
components:
  schemas:
    Tag:
      type: object
      required:
      - key
      - value
      properties:
        key:
          description: Key of the tag
          type: string
          minLength: 1
          maxLength: 4000
          example: key-1
        value:
          description: Value of the tag
          type: string
          minLength: 1
          maxLength: 4000
          example: value-1
    BookmarkPaaSDatabases:
      description: PaaS Database id and name associated with bookmark.
      type: object
      properties:
        paas_database_id:
          description: The PaaS Database id.
          type: string
          example: paas-database-id-1
        paas_database_name:
          description: The PaaS Database name.
          type: string
          example: paas-database-name
        root_parent_id:
          description: The root of the PaaS Database.
          type: string
          example: paas-instance-id-1
        paas_snapshot_id:
          description: The PaaS Snapshot id.
          type: string
          example: 1-SNAP-1
        data_timestamp:
          description: The timestamp of the PaaS Snapshot.
          type: string
          format: date-time
          example: '2021-05-01T08:51:34.148000+00:00'
    RefreshPaaSInstanceParameters:
      description: Parameters to refresh a PaaS Instance.
      type: object
      properties:
        source_instance_id:
          description: The ID of the PaaS Instance to refresh from.
          type: string
          example: db-123
        source_snapshot_id:
          description: The ID of the PaaS Instance snapshot to refresh from. This is optional, and mutually exclusive with the source_instance_id and timestamp.
          type: string
          example: snapshot-123
        timestamp:
          type: string
          format: date-time
          description: The point in time to refresh from. If the timestamp is not set, selects the latest point.
          example: '2021-05-01T08:51:34.148000+00:00'
    VirtualizationTaskEvent:
      deprecated: true
      properties:
        message_details:
          type: string
    BookmarkVDBs:
      description: VDB id and name associated with bookmark.
      type: object
      properties:
        vdb_id:
          description: The VDB id.
          type: string
          example: vdb-id-1
        vdb_name:
          description: The VDB name.
          type: string
          example: vdb-name
        snapshot_id:
          description: The snapshot id.
          type: string
          example: 1-SNAP-1
        source_data_timestamp:
          description: The timestamp of origin timeline location.
          type: string
          format: date-time
          example: '2021-05-01T08:51:34.148000+00:00'
        root_parent_id:
          description: The root of the VDB.
          type: string
          example: 1-DBCONTAINER-1
        timeflow_id:
          description: The timeflow id of the snapshot.
          type: string
        data_timestamp:
          description: The bookmark timestamp of the VDB.
          type: string
          format: date-time
    CloudTagsResponse:
      type: object
      properties:
        tags:
          description: Array of tags with key value pairs
          type: array
          items:
            $ref: '#/components/schemas/CloudTag'
    CloudTag:
      type: object
      required:
      - key
      - value
      properties:
        key:
          description: Key of the tag
          type: string
          minLength: 1
          maxLength: 4000
          example: key-1
        value:
          description: Value of the tag
          type: string
          minLength: 1
          maxLength: 4000
          example: value-1
        mirror_on_cloud:
          description: Whether this tag is mirrored from/to the Cloud Provider account hosting the PaaS Database or Instance. Not applicable to non PaaS objects.
          type: boolean
          default: false
    DeletePaaSInstanceParameters:
      description: Parameters to delete a PaaS Instance.
      type: object
      properties:
        delete_parameters:
          description: The parameters specified by the plugin schema for PaaS Instance delete
          type: object
          nullable: true
          additionalProperties: true
          example:
            foo: bar
        force_delete:
          type: boolean
          description: Whether to delete the Instance from DCT even if snapshots are present and the database deletion in the Cloud Account fails.
          default: false
    Engine:
      properties:
        engine_id:
          type: string
          minLength: 1
          maxLength: 4000
        engine_name:
          type: string
          minLength: 1
          maxLength: 4000
    ProvisionPaaSInstanceParameters:
      description: Parameters to provision a PaaS Instance.
      allOf:
      - $ref: '#/components/schemas/ProvisionPaaSInstanceBaseParameters'
      - type: object
        required:
        - name
        properties:
          source_instance_id:
            type: string
            description: ID of the PaaS Instance to provision from.
          source_snapshot_id:
            type: string
            description: The ID of the PaaS Instance snapshot to provision from. Mutually exclusive with source_instance_id and timestamp.
          timestamp:
            type: string
            format: date-time
            description: The point in time from which to provision. Needs to be set along with source_instance_id. If not set, selects latest point.
    PaginatedResponseMetadata:
      type: object
      properties:
        prev_cursor:
          description: Pointer to the previous page of results. Use this value as a cursor query parameter in a subsequent request, along with limit, to navigate through the collection by virtual page.
          type: string
        next_cursor:
          description: Pointer to the next page of results. Use this value as a cursor query parameter in a subsequent request, along with limit, to navigate through the collection by virtual page.
          type: string
        total:
          description: The total number of results. This value may not be provided.
          type: integer
          format: int_64
    JobTaskEvent:
      properties:
        message_details:
          type: string
    JobTask:
      properties:
        id:
          type: string
        parent_job_id:
          type: string
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        title:
          type: string
        percent_complete:
          type: integer
          minimum: 0
          maximum: 100
        events:
          type: array
          items:
            $ref: '#/components/schemas/JobTaskEvent'
        status:
          type: string
          enum:
          - PENDING
          - STARTED
          - TIMEDOUT
          - RUNNING
          - CANCELED
          - FAILED
          - SUSPENDED
          - WAITING
          - COMPLETED
          - ABANDONED
    BookmarkPaaSInstances:
      description: PaaS Instance id and name associated with bookmark.
      type: object
      properties:
        paas_instance_id:
          description: The PaaS Instance id.
          type: string
          example: paas-instance-id-1
        paas_instance_name:
          description: The PaaS Instance name.
          type: string
          example: paas-instance-name
        root_parent_id:
          description: The root of the PaaS Instance.
          type: string
          example: paas-instance-root-id-1
        paas_snapshot_id:
          description: The PaaS Instance snapshot id.
          type: string
          example: 1-SNAP-1
        data_timestamp:
          description: The timestamp of the PaaS Instance snapshot.
          type: string
          format: date-time
          example: '2021-05-01T08:51:34.148000+00:00'
    RefreshPaaSInstanceFromBookmarkParameters:
      type: object
      description: Parameters to refresh a PaaS Instance from bookmark.
      required:
      - bookmark_id
      properties:
        bookmark_id:
          description: The ID of the PaaS Instance bookmark to refresh from.
          type: string
          example: bookmark-123
    SearchBody:
      description: Search body.
      type: object
      properties:
        filter_expression:
          type: string
          minLength: 5
          maxLength: 50000
          example: string_field CONTAINS "over" AND numberic_field GT 9000 OR string_field2 EQ "Goku"
    PaaSConnectionEndpoint:
      description: A structured connection endpoint discovered from a PaaS Instance.
      type: object
      properties:
        host:
          description: The network hostname or IP address.
          type: string
        port:
          description: The TCP port.
          type: integer
          format: int32
        database_type:
          description: The type of database.
          type: string
          enum:
          - AURORA_POSTGRES
          - DB2
          - DB2_ISERIES
          - DB2_MAINFRAME
          - EXTENDED
          - GENERIC
          - MARIADB
          - MSSQL
          - MYSQL
          - ORACLE
          - POSTGRES
          - RDS_POSTGRES
          - SYBASE
          - YUGABYTEDB_POSTGRES
          - COCKROACHDB_POSTGRES
        database_name:
          description: The database or service name.
          type: string
        jdbc_url:
          description: The JDBC connection URL.
          type: string
    PaaSInstance:
      description: A database instance running in a cloud environment managed by a PaaS service.
      type: object
      properties:
        id:
          description: The PaaS Instance object entity ID.
          type: string
          example: instance-123
        name:
          description: The PaaS Instance name.
          type: string
          example: my-db-123
        plugin_id:
          description: Id of the PaaS plugin which manages this Instance.
          type: string
          example: plugin-123
        is_snapshot_operation_target:
          description: Whether this PaaS Instance can be the target of DCT snapshot operation.
          type: boolean
        cloud_account_id:
          description: Id of the Cloud Account to which this Instance belongs.
          type: string
          example: environment-123
        cloud_account_name:
          description: Name of the Cloud Account to which this Instance belongs.
          type: string
          example: AWS-US-EAST-1
        database_engine:
          description: Name of the database engine.
          type: string
          example: Azure SQL Server
        database_engine_version:
          description: Version of the database engine.
          type: string
          example: 19.1.2
        status:
          description: The management status of this PaaS Instance. DISCOVERED means the instance has been found by DCT but is not yet under DCT management. DCT_MANAGED means the instance is actively managed by DCT. ROOT means the instance serves as the root source for DCT-managed child instances.
          type: string
          enum:
          - DISCOVERED
          - DCT_MANAGED
          - ROOT
        runtime_status:
          description: Instance status.
          type: string
          enum:
          - CREATING
          - FAILED
          - RUNNING
          - DEPROVISIONED
          - STOPPED
          - DELETED_ROOT_SOURCE
          - REFRESHING
        connection_strings:
          description: Connection strings (such as JDBC URLs) for applications to connect to the instance.
          type: array
          items:
            type: string
        parent_instance_id:
          description: The ID of the parent PaaS Instance, if this is a child Instance.
