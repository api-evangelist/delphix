    StorageSavingsSummaryData:
      properties:
        dsource_id:
          description: Id of the dSource.
          type: string
        dependant_vdbs:
          description: The number of VDBs that are dependant on this dSource. This includes all VDB descendants that have this dSource as an ancestor.
          type: integer
          example: 200
        engine_name:
          description: The engine name.
          type: string
          minLength: 1
          example: My Favorite Engine
        unvirtualized_space:
          description: The disk space, in bytes, that it would take to store the dSource and its descendant VDBs without Delphix, counting each of their timeflows as separate copy of the parent source data.
          type: integer
          format: int64
          example: 109242677
        current_timeflows_unvirtualized_space:
          description: The disk space, in bytes, that it would take to store the dSource and its descendant VDBs without Delphix, counting only their current (active) timeflows.
          type: integer
          format: int64
          example: 109242677
        virtualized_space:
          description: The actual space used by the dSource and its dependant VDBs, in bytes.
          type: integer
          format: int64
          example: 12345678
        name:
          type: string
          description: The name of the database on the target environment.
          minLength: 1
          maxLength: 256
          example: my-test-database
        estimated_savings:
          type: integer
          description: The disk space that has been saved by using Delphix virtualizion for all descendant timeflows, in bytes.
          format: int64
          example: 109242677
        estimated_savings_perc:
          description: The disk space that has been saved by using Delphix virtualizion for all descendant timeflows, in percentage.
          type: number
        estimated_current_timeflows_savings:
          type: integer
          description: The disk space that has been saved by using Delphix virtualizion for only the current (active) timeflows, in bytes.
          format: int64
          example: 109242677
        estimated_current_timeflows_savings_perc:
          description: The disk space that has been saved by using Delphix virtualizion for only the current (active) timeflows, in percentage.
