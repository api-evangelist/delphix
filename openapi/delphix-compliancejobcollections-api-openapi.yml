          example: 100
        num_output_threads_per_stream:
          description: The amount of parallelism, per input stream, that the job uses to load back the masked data. For example, specifying 4 output threads per stream with 5 input streams results in a total of 20 output threads for the whole job. (Standard Job only).
          type: integer
          format: int32
          minimum: 1
          default: 1
