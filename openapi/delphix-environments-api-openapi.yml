    SSHVerificationStrategy:
      description: Mechanism to use for ssh host verification.
      required:
      - name
      properties:
        name:
          description: The name of the verification strategy.
          type: string
          enum:
          - RAW_KEY
          - FINGERPRINT
          - ACCEPT_ALWAYS
        key_type:
          description: The type of SSH key.
          type: string
          enum:
          - RSA
          - DSA
          - ECDSA
          - ED25519
        raw_key:
          description: Base64-encoded ssh key of the host for RAW_KEY verification.
          type: string
          minLength: 1
        fingerprint_type:
          description: Hash function for the fingerprint for FINGERPRINT verification.
          type: string
          enum:
          - SHA256
          - SHA512
        fingerprint:
          description: Base-64 encoded fingerprint of the ssh key of the host for FINGERPRINT verification.
          type: string
          minLength: 1
    Job:
      description: An asynchronous task.
      type: object
      properties:
        id:
          description: The Job entity ID.
          type: string
          example: job-123
        status:
          description: The status of the job.
          type: string
          enum:
          - PENDING
          - STARTED
          - TIMEDOUT
          - RUNNING
          - CANCELED
          - FAILED
          - SUSPENDED
          - WAITING
          - COMPLETED
          - ABANDONED
          example: RUNNING
        is_waiting_for_telemetry:
          description: Indicates that the operations performed by this Job have completed successfully, but the object changes are not yet reflected. This is only set when when the JOB is in STARTED status, with the guarantee that the job will not transition to the FAILED status. Note that this flag will likely be replaced with a new status in future API versions and be deprecated.
          type: boolean
        type:
          description: The type of job being done.
          type: string
          example: DB_REFRESH
        localized_type:
          description: The i18n translated type of job being done.
          type: string
          example: DB Refresh
        error_details:
          description: Details about the failure for FAILED jobs.
          type: string
          example: Unable to connect to the engine.
        warning_message:
          description: Warnings for the job.
          type: string
          example: 'Failed to remove local MaskingJob, engineId: 3 localMaskingJobId: 7.'
        target_id:
          description: A reference to the job's target.
          type: string
          example: vdb-123
        target_name:
          description: A reference to the job's target name.
          type: string
          example: vdb
        start_time:
          description: The time the job started executing.
          type: string
          format: date-time
          example: '2022-01-02T05:11:24.148000+00:00'
        update_time:
          description: The time the job was last updated.
          type: string
          format: date-time
          example: '2022-01-02T06:11:24.148000+00:00'
        trace_id:
          description: traceId of the request which created this Job
          type: string
        engine_ids:
          description: IDs of the engines this Job is executing on.
          type: array
          items:
            type: string
          deprecated: true
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        engines:
          type: array
          items:
            $ref: '#/components/schemas/Engine'
        account_id:
          description: The ID of the account who initiated this job.
          type: integer
          example: 1
        account_name:
          description: The account name which initiated this job. It can be either firstname and lastname combination or firstname or lastname or username or email address or Account-<id>.
          type: string
          example: User 1
        compliance_node_id:
          description: The ID of the associated compliance node, if applicable.
          type: string
          nullable: true
        compliance_node_name:
          description: The name of the associated compliance node, if applicable.
          type: string
          nullable: true
        percent_complete:
          description: Completion percentage of the Job.
          type: integer
          minimum: 0
          maximum: 100
          example: '50'
        virtualization_tasks:
          deprecated: true
          type: array
          items:
            $ref: '#/components/schemas/VirtualizationTask'
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/JobTask'
        execution_id:
          description: The ID of the associated masking execution, if any.
          type: string
          nullable: true
        result_type:
          description: The type of the job result. This is the type of the object present in the result.
          type: string
        result:
          description: The result of the job execution. This is JSON serialized string of the result object whose type is specified by result_type property.
          type: object
      discriminator:
        propertyName: class_type
  requestBodies:
    UpdateEnvironment:
      description: the parameters to update an environment
      content:
        application/json:
          schema:
            x-body-name: environment
            $ref: '#/components/schemas/EnvironmentUpdateParameters'
          examples:
            unix_standalone:
              description: 'The request example is intended for updating Unix standalone environments.

                '
              summary: Unix - Standalone Environments
              value:
                name: oracle-environment
                ase_db_username: user-123
                ase_db_password: test
                ase_db_vault: my-vault
                ase_db_hashicorp_vault_engine: kv
                ase_db_hashicorp_vault_secret_path: ase-env
                ase_db_hashicorp_vault_username_key: username
                ase_db_hashicorp_vault_secret_key: password
                ase_db_cyberark_vault_query_string: Safe=Test;Folder=Test;Object=Test
                ase_db_use_kerberos_authentication: true
                description: Unix Oracle source host
            windows_standalone_target:
              description: 'The request example is intended for updating Windows standalone target environments.

                '
              summary: Windows - Standalone Target Environments
              value:
                name: win-target
                description: Windows MSSql target host
                encryption_enabled: false
            windows_standalone_source:
              description: 'The request example is intended for updating Windows standalone source environments.

                '
              summary: Windows - Standalone Source Environments
              value:
                name: win-source
                staging_environment: 1-WINDOWS_HOST-1
                description: Windows MSSql source host
            unix_cluster:
              description: 'The request example is intended for updating Unix cluster environments.

                '
              summary: Unix - Cluster Environments
              value:
                name: rac-environment
                cluster_home: /u01/app/19.0.0.0/grid
                cluster_node_address: db1.host.com
                description: Unix rac host
                scan: abc-scan.xyz.com
                remote_listener: remote-listener.xyz.com
            windows_cluster:
              description: 'The request example is intended for updating Windows cluster environments.

                '
              summary: Windows - Cluster Environments
              value:
                name: mssql-cluster
                cluster_address: db-cluster.host.com
                cluster_node_address: db1.host.com
                staging_environment: 1-WINDOWS_HOST-1
                description: Windows mssql host
