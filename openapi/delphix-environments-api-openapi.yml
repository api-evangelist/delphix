      - name
      - okv_client_path
      properties:
        name:
          type: string
          description: The name of this OKV client.
          minLength: 1
          maxLength: 256
          example: my-okv-client
        okv_client_path:
          type: string
          description: The path of this OKV client.
          minLength: 1
          example: /path-to-wallet-root/okv
        okv_client_password:
          x-dct-toolkit-credential-field: true
          type: string
          description: The password of this OKV client.
          minLength: 1
          maxLength: 128
