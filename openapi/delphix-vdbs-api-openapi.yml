components:
  schemas:
    DeletionDependenciesResponse:
      description: The deletion dependencies of a dataset.
      type: object
      properties:
        items:
          description: The deletion dependencies of a dataset. These are presented in reverse order of deletion meaning that the last item in the list is the first item that needs to be deleted.
          type: array
          items:
            $ref: '#/components/schemas/EngineStorageCapacityDependencyData'
    ProvisionVDBBySnapshotDefaultsRequest:
      type: object
      properties:
        snapshot_id:
          type: string
          description: The ID of the snapshot from which to execute the operation.
          minLength: 1
          maxLength: 256
          example: snapshot-123
        engine_id:
          type: string
          description: The ID of the Engine onto which to provision. If the source ID unambiguously identifies a source object, this parameter is unnecessary and ignored.
          minLength: 1
          maxLength: 256
          example: engine-123
        source_data_id:
          type: string
          description: The ID of the source object (dSource or VDB) to provision from. If this property is not set, the data_source of the snapshot_id will be used.
          minLength: 1
          maxLength: 256
          example: source-123
    RollbackVDBBySnapshotParameters:
      deprecated: true
      allOf:
      - $ref: '#/components/schemas/DataPointBySnapshotParameters'
    BookmarkVDBs:
      description: VDB id and name associated with bookmark.
      type: object
      properties:
        vdb_id:
          description: The VDB id.
          type: string
          example: vdb-id-1
        vdb_name:
          description: The VDB name.
          type: string
          example: vdb-name
        snapshot_id:
          description: The snapshot id.
          type: string
          example: 1-SNAP-1
        source_data_timestamp:
          description: The timestamp of origin timeline location.
          type: string
          format: date-time
          example: '2021-05-01T08:51:34.148000+00:00'
        root_parent_id:
          description: The root of the VDB.
          type: string
          example: 1-DBCONTAINER-1
        timeflow_id:
          description: The timeflow id of the snapshot.
          type: string
        data_timestamp:
          description: The bookmark timestamp of the VDB.
          type: string
          format: date-time
    SwitchTimeflowParameters:
      type: object
      description: Parameters to switch the timeflow of a VDB.
      properties:
        timeflow_id:
          type: string
          description: The ID of the timeflow to switch to.
          example: timeflow-123
    PaginatedResponseMetadata:
      type: object
      properties:
        prev_cursor:
          description: Pointer to the previous page of results. Use this value as a cursor query parameter in a subsequent request, along with limit, to navigate through the collection by virtual page.
          type: string
        next_cursor:
          description: Pointer to the next page of results. Use this value as a cursor query parameter in a subsequent request, along with limit, to navigate through the collection by virtual page.
          type: string
        total:
          description: The total number of results. This value may not be provided.
          type: integer
          format: int_64
    VirtualDatasetHooks:
      description: VDB operation hooks.
      type: object
      properties:
        pre_refresh:
          type: array
          maxItems: 100
          description: The commands to execute on the target environment before refreshing the VDB.
          items:
            $ref: '#/components/schemas/Hook'
        post_refresh:
          type: array
          maxItems: 100
          description: The commands to execute on the target environment after refreshing the VDB.
          items:
            $ref: '#/components/schemas/Hook'
            deprecated: true
        pre_self_refresh:
          type: array
          maxItems: 100
          description: The commands to execute on the target environment before refreshing the VDB with data from itself.
          items:
            $ref: '#/components/schemas/Hook'
        post_self_refresh:
          type: array
          maxItems: 100
          description: The commands to execute on the target environment after refreshing the VDB with data from itself.
          items:
            $ref: '#/components/schemas/Hook'
        pre_rollback:
          deprecated: true
          type: array
          maxItems: 100
          description: The commands to execute on the target environment before rewinding the VDB.
          items:
            $ref: '#/components/schemas/Hook'
        post_rollback:
          deprecated: true
          type: array
          maxItems: 100
          description: The commands to execute on the target environment after rewinding the VDB.
          items:
            $ref: '#/components/schemas/Hook'
        configure_clone:
          type: array
          maxItems: 100
          description: The commands to execute on the target environment when the VDB is created or refreshed.
          items:
            $ref: '#/components/schemas/Hook'
        pre_snapshot:
          type: array
          maxItems: 100
          description: The commands to execute on the target environment before snapshotting a virtual source. These commands can quiesce any data prior to snapshotting.
          items:
            $ref: '#/components/schemas/Hook'
        post_snapshot:
          type: array
          maxItems: 100
          description: The commands to execute on the target environment after snapshotting a virtual source.
          items:
            $ref: '#/components/schemas/Hook'
        pre_start:
          type: array
          maxItems: 100
          description: The commands to execute on the target environment before starting a virtual source.
          items:
            $ref: '#/components/schemas/Hook'
        post_start:
          type: array
          maxItems: 100
          description: The commands to execute on the target environment after starting a virtual source.
          items:
            $ref: '#/components/schemas/Hook'
        pre_stop:
          type: array
          maxItems: 100
          description: The commands to execute on the target environment before stopping a virtual source.
          items:
            $ref: '#/components/schemas/Hook'
        post_stop:
          type: array
          maxItems: 100
          description: The commands to execute on the target environment after stopping a virtual source.
          items:
            $ref: '#/components/schemas/Hook'
      discriminator:
        propertyName: class_type
    OracleRACDatabaseInstance:
      type: object
      required:
      - instance_name
      - instance_number
      - node_reference
      properties:
        instance_name:
          type: string
          description: The name of this instance. Must contain at least one non-whitespace character.
          minLength: 1
          pattern: .*\S.*
        instance_number:
          type: integer
          description: The number of this instance.
          minimum: 1
        node_reference:
          type: string
          description: The reference to the cluster node which the instance is running on. Must contain at least one non-whitespace character.
          minLength: 1
          pattern: .*\S.*
        okv_client_id:
          description: The id of the OKV client used for TDE keystore access. If provided, it must include at least one non-whitespace character; if omitted, the existing OKV client will be cleared.
          type: string
          minLength: 1
          pattern: .*\S.*
          example: 1-ORACLE_OKV_CLIENT-1
    OracleCustomEnvVar:
      type: object
      properties:
        cluster_node:
          type: string
          description: The cluster node on which the environment variable is relevant.
        path_parameters:
          type: string
          description: A string of whitespace-separated parameters to be passed to the source command. The first parameter must be an absolute path to a file that exists on the target environment. Every subsequent parameter will be treated as an argument interpreted by the environment file.
        var_name:
          type: string
          description: The name of the environment variable.
        var_value:
