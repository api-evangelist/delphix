          description: The JSON payload conforming to the DraftV4 schema based on the type of application data being manipulated.
          type: object
          additionalProperties: true
        excludes:
          type: array
          description: List of subdirectories in the source to exclude when syncing data. These paths are relative to the root of the source directory. [AppDataDirect only]
          items:
            type: string
            minLength: 1
            maxLength: 1024
        follow_symlinks:
          type: array
          description: List of symlinks in the source to follow when syncing data. These paths are relative to the root of the source directory. All other symlinks are preserved. [AppDataDirect only]
          items:
            type: string
            minLength: 1
            maxLength: 1024
        sync_policy_id:
          type: string
          description: The ID of the SnapSync policy for the dSource.
          minLength: 1
          maxLength: 256
          example: snapshot-123
        retention_policy_id:
          type: string
          description: The ID of the Retention policy for the dSource.
          minLength: 1
          maxLength: 256
          example: retention-policy-123
        ops_pre_sync:
          deprecated: true
          description: Operations to perform before syncing the created dSource. These operations can quiesce any data prior to syncing.
          type: array
          items:
            $ref: '#/components/schemas/SourceOperation'
        ops_post_sync:
          deprecated: true
          description: Operations to perform after syncing a created dSource.
          type: array
          items:
            $ref: '#/components/schemas/SourceOperation'
        hooks:
          $ref: '#/components/schemas/DSourceHooks'
    DSourceSnapshotParameters:
      type: object
      description: Parameters to snapshot a DSource.
      properties:
        drop_and_recreate_devices:
          type: boolean
          description: 'If this parameter is set to true, older devices will be dropped and new

            devices created instead of trying to remap the devices. This might increase

            the space utilization on Delphix Engine. (ASE only)

            '
        sync_strategy:
          type: string
          enum:
          - latest_backup
          - new_backup
          - specific_backup
          description: "Determines how the Delphix Engine will take a backup:\n* `latest_backup` - Use the most recent backup.\n* `new_backup` - Delphix will take a new backup of your source database.\n* `specific_backup` - Use a specific backup. Using this option requires setting\n  `ase_backup_files` for ASE dSources or `mssql_backup_uuid` for MSSql dSources.\nDefault is `new_backup`.\n(ASE, MSSql only)\n"
        ase_backup_files:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 4096
          description: When using the `specific_backup` sync_strategy, determines the backup files. (ASE Only)
        mssql_backup_uuid:
          type: string
          minLength: 1
          maxLength: 4096
          description: When using the `specific_backup` sync_strategy, determines the Backup Set UUID. (MSSql only)
        compression_enabled:
          type: boolean
          description: When using the `new_backup` sync_strategy, determines if compression must be enabled. Defaults to the configuration of the ingestion strategy configured on the Delphix Engine for this dSource. (MSSql only)
        availability_group_backup_policy:
          type: string
          enum:
          - primary
          - secondary_only
          - prefer_secondary
          description: 'When using the `new_backup` sync_strategy for an MSSql Availability Group, determines the backup policy:

            * `primary` - Backups only go to the primary node.

            * `secondary_only` - Backups only go to secondary nodes. If secondary nodes are down, backups will fail.

            * `prefer_secondary` - Backups go to secondary nodes, but if secondary nodes are down, backups will go to the primary node.

            (MSSql only)

            '
        do_not_resume:
          type: boolean
          description: 'Indicates whether a fresh SnapSync must be started regardless if it was possible to

            resume the current SnapSync. If true, we will not resume but instead ignore previous progress

            and backup all datafiles even if already completed from previous failed SnapSync. This does not

            force a full backup, if an incremental was in progress this will start a new incremental snapshot.

            (Oracle only)

            '
        double_sync:
          type: boolean
          description: 'Indicates whether two SnapSyncs should be performed in immediate succession to reduce the number

            of logs required to provision the snapshot. This may significantly reduce the time necessary to

            provision from a snapshot.

            (Oracle only).

            '
        force_full_backup:
          type: boolean
          description: Whether or not to take another full backup of the source database. (Oracle only)
        skip_space_check:
          type: boolean
          description: 'Skip check that tests if there is enough space available to store the database in

            the Delphix Engine. The Delphix Engine estimates how much space a database will occupy after

            compression and prevents SnapSync if insufficient space is available. This safeguard can be

            overridden using this option. This may be useful when linking highly compressible databases.

            (Oracle only)

            '
        files_for_partial_full_backup:
          type: array
          minItems: 1
          maxItems: 10000
          items:
            type: integer
            format: int64
          description: 'List of datafiles to take a full backup of. This would be useful in situations

            where certain datafiles could not be backed up during previous SnapSync due to corruption

            or because they went offline.

            (Oracle only)

            '
        appdata_parameters:
          description: The list of parameters specified by the snapshotParametersDefinition schema in the toolkit (AppData only).
          type: object
          additionalProperties: true
          nullable: true
          example:
            resync: true
        rman_rate_in_MB:
          type: integer
          description: 'RMAN rate in megabytes to be used. This is the upper limit for bytes read so that

            RMAN does not consume excessive disk bandwidth and degrade online performance. (Oracle only)

            '
