          description: The name of the database.
          example: DBOMSRBB
        repository_id:
          type: string
          description: The repository_id to use for this operation.
          example: 1-ORACLE_INSTALL-1
        environment_user_ref:
          type: string
          description: The environment user reference.
          example: HOST_USER-10
        tde_keystore_password:
          x-dct-toolkit-credential-field: true
          deprecated: true
          type: string
          description: The password for the Transparent Data Encryption keystore associated with this database.
          example: password
        tde_keystore_config_type:
          deprecated: true
          description: The TDE keystore configuration type of this database.
          $ref: '#/components/schemas/OracleTdeKeystoreConfigTypeEnum'
          example: OKV
        oracle_instance_name:
          type: string
          description: SID of the exported database
          pattern: ^[a-zA-Z0-9_]+$
          minLength: 1
          maxLength: 15
          example: DBOMSRBBDC6C
        instance_number:
          type: integer
          format: int32
          description: The number of the instance.
          example: 1
        instances:
          type: array
          items:
            $ref: '#/components/schemas/OracleRACDatabaseInstance'
        mount_base:
          type: string
          description: The base mount point to use for the NFS mounts for the temporary VDB.
          example: /tmp/provision
        config_params:
          description: Database configuration parameter overrides.
          type: object
          additionalProperties: true
          nullable: true
          example:
            param: value
            param2: value2
        cdb_id:
          description: ID of an Oracle multitenant database this pluggable database belongs to.
          type: string
          example: CDOMLOSRB5A3
        parent_tde_keystore_path:
          type: string
          description: Path to a copy of the parent's Oracle transparent data encryption keystore on the target host.
          example: /work/tde/parent_keystore
        parent_tde_keystore_password:
          x-dct-toolkit-credential-field: true
          type: string
          description: The password of the keystore specified in parentTdeKeystorePath.
          example: password
        tde_exported_keyfile_secret:
          x-dct-toolkit-credential-field: true
          type: string
          description: Secret to be used while exporting and importing vPDB encryption keys.
          example: secret
        tde_key_identifier:
          type: string
          description: PDB database master encryption key id, as recorded in v$encryption_keys.key_id.
          example: Ae5Eo6WB208lv+XJfXMTv8sAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
        parent_pdb_tde_keystore_path:
          description: 'Path to a copy of the parent PDB''s Oracle transparent data encryption keystore on the target host.

            Required to export of PDB containing encrypted database files with isolated mode keystore.(Oracle Multitenant Only)

            '
          type: string
          minLength: 1
          maxLength: 512
          example: /work/MYCDB/0FE1C5BBC29D9B20E06379CB6E0A1EFC/tde
        parent_pdb_tde_keystore_password:
          x-dct-toolkit-credential-field: true
          description: The password of the parent PDB keystore. (Oracle Multitenant Only)
          type: string
          minLength: 1
          maxLength: 128
          example: password
        target_pdb_tde_keystore_password:
          x-dct-toolkit-credential-field: true
          description: The password for the isolated mode TDE keystore of the target PDB. (Oracle Multitenant Only)
          type: string
          minLength: 1
          maxLength: 128
          example: password
        crs_database_name:
          type: string
          description: The Oracle Clusterware database name.
          example: DBOMSR9051BF
        recover_database:
          type: boolean
          default: true
          description: If specified, then take the exported database through recovery procedures, if necessary, to reach a consistent point.
          example: true
        file_mapping_rules:
          type: string
          description: Database file mapping rules.
        enable_cdc:
          type: boolean
          default: false
          description: Indicates whether to enable Change Data Capture (CDC) or not on exported database(MSSql Only).
          example: false
        recovery_model:
          type: string
          description: Recovery model of the database (MSSql Only).
          enum:
          - FULL
          - SIMPLE
          - BULK_LOGGED
          default: FULL
          example: FULL
        mirroring_state:
          type: string
          description: Recovery model of the database (MSSql Only).
          enum:
          - SUSPENDED
          - DISCONNECTED
          - SYNCHRONIZING
          - PENDING_FAILOVER
          - SYNCHRONIZED
          - NOT_SYNCHRONIZED
          - FAILOVER_POSSIBLE
          - NONE
          default: NONE
          example: SUSPENDED
        is_incremental_v2p:
          type: boolean
          description: Whether to enable incremental V2P (Virtual to Physical) export. When enabled, the export will be configured for incremental backups.
          example: false
        backup_frequency_minutes:
          type: integer
          format: int32
          minimum: 10
          default: 30
          description: The frequency with which the incremental backup will be taken in minutes.
          example: 30
        rman_channels_for_incremental_backup:
          type: integer
          format: int32
          minimum: 1
          maximum: 255
          description: Number of data streams to connect to the database for incremental backup.
          default: 8
          example: 4
        rman_files_per_set_for_incremental_backup:
          type: integer
          format: int32
          minimum: 1
          maximum: 64
          description: Number of data files to include in each RMAN backup set for incremental backup.
          default: 5
          example: 8
        rman_file_section_size_in_gb_for_incremental_backup:
          type: integer
          format: int32
          minimum: 0
          description: Number of GigaBytes in which RMAN will break large files to back them up in parallel for incremental backup.
          default: 0
          example: 0
        invoke_datapatch:
          type: boolean
          default: false
          description: Indicates whether to invoke Oracle's datapatch utility during post recovery step of exportFinalize. Requires Delphix engine version 2025.6.0.0 (API version 1.11.46) or later.
          example: false
      discriminator:
        propertyName: class_type
