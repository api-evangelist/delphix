openapi: 3.0.0
info:
  title: Delphix DCT Algorithms MaskingJobs API
  version: 3.28.0
  description: Delphix DCT API
  contact:
    name: Delphix Support
    url: https://portal.perforce.com/s/
    email: support@delphix.com
servers:
- url: /dct/v3
security:
- ApiKeyAuth: []
tags:
- name: MaskingJobs
paths:
  /masking-jobs:
    get:
      deprecated: true
      tags:
      - MaskingJobs
      summary: Retrieve the list of masking jobs.
      operationId: get_masking_jobs
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/maskingJobsSortParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                title: ListMaskingJobsResponse
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MaskingJob'
                  response_metadata:
                    $ref: '#/components/schemas/PaginatedResponseMetadata'
    post:
      tags:
      - MaskingJobs
      summary: Create a Masking Job.
      operationId: create_masking_job
      requestBody:
        content:
          application/json:
            schema:
              x-body-name: create_job_request
              $ref: '#/components/schemas/CreateMaskingJobRequest'
        description: Input params to create a masking job.
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                title: CreateMaskingJobResponse
                properties:
                  id:
                    type: string
                    description: The ID of the created masking job.
                  job:
                    $ref: '#/components/schemas/Job'
                    description: The initiated DCT job.
  /masking-jobs/search:
    post:
      deprecated: true
      tags:
      - MaskingJobs
      summary: Search masking jobs.
      operationId: search_masking_jobs
      x-filterable:
        fields:
          id:
            type: string
          name:
            type: string
          is_on_the_fly_masking:
            type: boolean
          creation_date:
            type: string
          last_completed_execution_date:
            type: string
          last_execution_status:
            type: string
          last_execution_id:
            type: string
          connector_username:
            type: string
          on_the_fly_source_connector_username:
            type: string
          rule_set_id:
            type: string
          rule_set_name:
            type: string
          ruleset.connector_id:
            type: string
          ruleset.type:
            type: string
          ruleset.name:
            type: string
          ruleset.refresh_drops_table:
            type: boolean
          ruleset.algorithms:
            type: array[string]
          hyperscale_instance_id:
            type: string
          description:
            type: string
          dataset_id:
            type: string
          retain_execution_data:
            type: string
          max_memory:
            type: integer
          min_memory:
            type: integer
          feedback_size:
            type: integer
          stream_row_limit:
            type: integer
          num_input_streams:
            type: integer
          max_concurrent_source_connections:
            type: integer
          max_concurrent_target_connections:
            type: integer
          parallelism_degree:
            type: integer
          tags:
            type: array[object]
            fields:
              key:
                type: string
              value:
                type: string
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/maskingJobsSortParam'
      requestBody:
        $ref: '#/components/requestBodies/SearchBody'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                title: SearchMaskingJobsResponse
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MaskingJob'
                  response_metadata:
                    $ref: '#/components/schemas/PaginatedResponseMetadata'
  /masking-jobs/source-engines:
    get:
      tags:
      - MaskingJobs
      summary: Retrieve the list of masking jobs along with their source engine.
      operationId: get_masking_job_source_engines
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/maskingJobSourceEnginesSortParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                title: ListMaskingJobSourceEnginesResponse
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MaskingJobSourceEngine'
                  response_metadata:
                    $ref: '#/components/schemas/PaginatedResponseMetadata'
  /masking-jobs/source-engines/search:
    post:
      tags:
      - MaskingJobs
      summary: Search the list of masking jobs along with their source engine.
      operationId: search_masking_job_source_engines
      x-filterable:
        fields:
          masking_job_id:
            type: string
          source_engine_id:
            type: string
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/maskingJobSourceEnginesSortParam'
      requestBody:
        $ref: '#/components/requestBodies/SearchBody'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                title: SearchMaskingJobSourceEnginesResponse
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MaskingJobSourceEngine'
                  response_metadata:
                    $ref: '#/components/schemas/PaginatedResponseMetadata'
  /masking-jobs/{maskingJobId}:
    parameters:
    - $ref: '#/components/parameters/maskingJobIdParam'
    delete:
      tags:
      - MaskingJobs
      summary: Delete a masking job.
      operationId: delete_masking_job
      parameters:
      - $ref: '#/components/parameters/maskingJobDeleteForceParam'
      responses:
        '200':
          description: Masking job delete initiated.
          content:
            application/json:
              schema:
                type: object
                title: DeleteMaskingJobResponse
                properties:
                  job:
                    $ref: '#/components/schemas/Job'
                    description: The initiated job.
    get:
      deprecated: true
      summary: Retrieve a MaskingJob by ID.
      operationId: get_masking_job_by_id
      tags:
      - MaskingJobs
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaskingJob'
    patch:
      summary: Update values of a MaskingJob.
      operationId: update_masking_job_by_id
      tags:
      - MaskingJobs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMaskingJobParameters'
        description: The new data to update a Masking Job.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaskingJob'
  /masking-jobs/{maskingJobId}/copy:
    parameters:
    - $ref: '#/components/parameters/maskingJobIdParam'
    post:
      deprecated: true
      tags:
      - MaskingJobs
      summary: Copies the masking job to another engine.
      operationId: copy_masking_job
      requestBody:
        content:
          application/json:
            schema:
              x-body-name: copy_masking_job_params
              $ref: '#/components/schemas/CopyMaskingJobParameters'
      responses:
        '200':
          description: Copy masking job initiated.
          content:
            application/json:
              schema:
                type: object
                title: CopyMaskingJobResponse
                properties:
                  job:
                    $ref: '#/components/schemas/Job'
                    description: The initiated job.
                  masking_job_id:
                    type: string
  /masking-jobs/{maskingJobId}/migrate:
    parameters:
    - $ref: '#/components/parameters/maskingJobIdParam'
    post:
      deprecated: true
      tags:
      - MaskingJobs
      summary: Migrates the masking job from its current source engine to another engine.
      operationId: migrate_masking_job
      requestBody:
        content:
          application/json:
            schema:
              x-body-name: migrate_masking_job_params
              $ref: '#/components/schemas/MigrateMaskingJobParameters'
      responses:
        '200':
          description: Migrate masking job initiated.
          content:
            application/json:
              schema:
                type: object
                title: MigrateMaskingJobResponse
                properties:
                  job:
                    $ref: '#/components/schemas/Job'
                    description: The initiated job.
  /masking-jobs/{maskingJobId}/connectors:
    parameters:
    - $ref: '#/components/parameters/maskingJobIdParam'
    get:
      deprecated: true
      tags:
      - MaskingJobs
      summary: Get connectors for a Masking Job by ID.
      operationId: get_masking_job_connectors
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaskingJobConnectorsResponse'
  /masking-jobs/{maskingJobId}/execute:
    parameters:
    - $ref: '#/components/parameters/maskingJobIdParam'
    post:
      deprecated: true
      summary: Execute a MaskingJob.
      operationId: execute_masking_job
      tags:
      - MaskingJobs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteMaskingJobParameters'
      responses:
        '200':
          description: Masking job execute initiated.
          content:
            application/json:
              schema:
                type: object
                title: ExecuteMaskingJobResponse
                properties:
                  job:
                    $ref: '#/components/schemas/Job'
                    description: The initiated job.
  /masking-jobs/{maskingJobId}/re-import:
    parameters:
    - $ref: '#/components/parameters/maskingJobIdParam'
    post:
      tags:
      - MaskingJobs
      summary: Re-import the dataset from the source MaskingJob (Hyperscale Job only).
      operationId: re_import_masking_job
      responses:
        '200':
          description: Masking job re-import initiated.
          content:
            application/json:
              schema:
                type: object
                title: ReImportMaskingJobResponse
                properties:
                  job:
                    $ref: '#/components/schemas/Job'
                    description: The initiated job.
  /masking-jobs/{maskingJobId}/tags:
    parameters:
    - $ref: '#/components/parameters/maskingJobIdParam'
    post:
      deprecated: true
      tags:
      - MaskingJobs
      summary: Create tags for a Masking Job.
      operationId: create_masking_job_tag
      requestBody:
        content:
          application/json:
            schema:
              x-body-name: masking_job_tags
              $ref: '#/components/schemas/TagsRequest'
        description: Tags information for Masking Job.
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagsResponse'
    get:
      deprecated: true
      tags:
      - MaskingJobs
      summary: Get tags for a Masking Job.
      operationId: get_masking_job_tag
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagsResponse'
  /masking-jobs/{maskingJobId}/tags/delete:
    parameters:
    - $ref: '#/components/parameters/maskingJobIdParam'
    post:
      deprecated: true
      tags:
      - MaskingJobs
      summary: Delete tags for a Masking Job.
      operationId: delete_masking_job_tag
      requestBody:
        $ref: '#/components/requestBodies/DeleteTags'
        required: false
      responses:
        '204':
          description: No Content
  /masking-jobs/{maskingJobId}/add-engine:
    parameters:
    - $ref: '#/components/parameters/maskingJobIdParam'
    post:
      tags:
      - MaskingJobs
      summary: Add an engine to a Masking Job (Hyperscale Job only).
      operationId: add_engine_to_masking_job
      requestBody:
        content:
          application/json:
            schema:
              x-body-name: engine_id
              $ref: '#/components/schemas/EngineIdBody'
        description: Body containing the ID of the registered engine.
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                title: AddEngineToJobResponse
                properties:
                  job:
                    $ref: '#/components/schemas/Job'
  /masking-jobs/{maskingJobId}/remove-engine:
    parameters:
    - $ref: '#/components/parameters/maskingJobIdParam'
    post:
      tags:
      - MaskingJobs
      summary: Remove an engine from a Masking Job (Hyperscale Job only).
      operationId: remove_engine_from_masking_job
      requestBody:
        content:
          application/json:
            schema:
              x-body-name: engine_id
              $ref: '#/components/schemas/EngineIdBody'
        description: Body containing the ID of the registered engine.
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                title: RemoveEngineFromJobResponse
                properties:
                  job:
                    $ref: '#/components/schemas/Job'
components:
  schemas:
    ConnectorTypeEnum:
      type: string
      enum:
      - DATABASE
      - FILE
      - MAINFRAME_DATASET
      example: DATABASE
    Tag:
      type: object
      required:
      - key
      - value
      properties:
        key:
          description: Key of the tag
          type: string
          minLength: 1
          maxLength: 4000
          example: key-1
        value:
          description: Value of the tag
          type: string
          minLength: 1
          maxLength: 4000
          example: value-1
    ExecuteMaskingJobParameters:
      type: object
      description: Parameters to execute a MaskingJob.
      properties:
        engine_id:
          type: string
          description: The ID of the Engine to execute this MaskingJob on (Standard job only).
          minLength: 1
          example: engine-123
    VirtualizationTaskEvent:
      deprecated: true
      properties:
        message_details:
          type: string
    Engine:
      properties:
        engine_id:
          type: string
          minLength: 1
          maxLength: 4000
        engine_name:
          type: string
          minLength: 1
          maxLength: 4000
    MaskingRuleset:
      description: A masking ruleset.
      type: object
      properties:
        type:
          description: The Ruleset type.
          type: string
          enum:
          - FILE
          - DATABASE
          - MAINFRAME_DATASET
          nullable: true
        name:
          description: The name of this Ruleset.
          type: string
        refresh_drops_tables:
          description: Whether refresh drops tables. Only applicable to database ruleset type.
          type: boolean
          nullable: true
        algorithms:
          description: The list of algorithms for this Ruleset.
          type: array
          items:
            type: string
            minLength: 1
      example:
        type: DATABASE
        name: The best Ruleset
        refresh_drops_tables: true
    PaginatedResponseMetadata:
      type: object
      properties:
        prev_cursor:
          description: Pointer to the previous page of results. Use this value as a cursor query parameter in a subsequent request, along with limit, to navigate through the collection by virtual page.
          type: string
        next_cursor:
          description: Pointer to the next page of results. Use this value as a cursor query parameter in a subsequent request, along with limit, to navigate through the collection by virtual page.
          type: string
        total:
          description: The total number of results. This value may not be provided.
          type: integer
          format: int_64
    JobTaskEvent:
      properties:
        message_details:
          type: string
    Connector:
      description: Connectors are the way users define the data sources to which the Masking Engine should connect.
      type: object
      properties:
        id:
          description: The Connector entity ID.
          type: string
          example: 1-database-123
        name:
          description: The Connector name.
          type: string
          example: connector-name
        engine_id:
          description: The id of the Compliance Engine that this Connector belongs to.
          type: string
          example: '123'
        engine_name:
          description: The name of the Compliance Engine that this Connector belongs to.
          type: string
          example: my-compliance-engine-1
        type:
          description: The type of Connector. One of Database, File, or Mainframe.
          $ref: '#/components/schemas/ConnectorTypeEnum'
        hostname:
          description: The network hostname or IP address of the database server.
          type: string
          example: database_server.mycompany.co
        port:
          description: The TCP port of the server.
          type: integer
          format: int32
          minimum: 1
          maximum: 65535
          example: 9100
        username:
          description: The username this Connector will use to connect to the database.
          type: string
        password:
          x-dct-toolkit-credential-field: true
          description: The password this Connector will use to connect to the database.
          type: string
        auth_present:
          description: Whether this connector has authentication credentials set
          type: boolean
        database_type:
          description: The database variant, such as Oracle or MSSQL Server
          type: string
          enum:
          - AURORA_POSTGRES
          - DB2
          - DB2_ISERIES
          - DB2_MAINFRAME
          - EXTENDED
          - GENERIC
          - MARIADB
          - MSSQL
          - MYSQL
          - ORACLE
          - POSTGRES
          - RDS_POSTGRES
          - SYBASE
          - YUGABYTEDB_POSTGRES
          - COCKROACHDB_POSTGRES
          example: ORACLE
        custom_driver_name:
          description: The name of the custom JDBC driver for this connector
          type: string
        database_name:
          description: The database name for this connector
          type: string
        instance_name:
          description: The instance name for this connector
          type: string
        jdbc:
          description: The jdbc URL for this connector
          type: string
        schema_name:
          description: The schema name for this connector
          type: string
        sid:
          description: The SID value for this connector. This field is specific to Oracle database connectors
          type: string
        kerberos_auth:
          description: Whether kerberos authentication is enabled for this connector
          type: boolean
        service_principal:
          description: The service principal to use for kerberos authentication
          type: string
        enable_logger:
          description: Whether the logger is enable for this connector
          type: boolean
        file_type:
          description: The type of file this connector is configured to access. Immutable after creation.
          type: string
          enum:
          - DELIMITED
          - FIXED_WIDTH
          - XML
          - JSON
          - PARQUET
          example: DELIMITED
        connection_mode:
          description: The connection mode for file connectors.
          type: string
          enum:
          - FTP
          - FTPS
          - SFTP
          - MOUNT
          - AWS_S3
          - S3_COMPATIBLE
          - AZURE_BLOB_STORAGE
          example: SFTP
        path:
          description: The path on the remote server for file connections.
          type: string
        ssh_key:
          description: 'The DCT SSH key UUID (from POST /ssh-keys) to use for SFTP connections. DCT pushes the key bytes to the engine filesystem before connector sync.

            '
          type: string
        user_dir_is_root:
          description: For SFTP connections only, whether the user dir is set to root.
          type: boolean
          default: false
        mount_information_id:
          description: The DCT UUID of the mount information record (MOUNT mode only).
          type: string
        bucket_name:
          description: The storage bucket name (AWS_S3 and S3_COMPATIBLE modes).
          type: string
        region:
          description: The cloud storage region (AWS_S3 and S3_COMPATIBLE modes).
          type: string
        access_key:
          x-dct-toolkit-credential-field: true
          description: The access key for cloud storage authentication (AWS and AZURE modes).
          type: string
        secret_key:
          x-dct-toolkit-credential-field: true
          description: The secret key for AWS storage authentication.
          type: string
        auth_type:
          description: 'The authentication type for cloud storage. For AWS_S3: AWS_ROLE or AWS_SECRET. For AZURE_BLOB_STORAGE: AZURE_MANAGED_IDENTITY or AZURE_SECRET.

            '
          type: string
          enum:
          - AWS_ROLE
          - AWS_SECRET
          - AZURE_MANAGED_IDENTITY
          - AZURE_SECRET
        prefix:
          description: The key prefix for cloud storage (AWS and AZURE modes).
          type: string
        delimiter:
          description: The key delimiter for cloud storage (AWS and AZURE modes).
          type: string
        service_endpoint:
          description: The service endpoint URL for S3_COMPATIBLE mode.
          type: string
        azure_account_name:
          description: The Azure storage account name (AZURE_BLOB_STORAGE mode).
          type: string
        azure_container_name:
          description: The Azure blob container name (AZURE_BLOB_STORAGE mode).
          type: string
        is_mvs_storage:
          description: Whether the mainframe connector uses MVS storage. Read-only.
          type: boolean
          readOnly: true
        password_vault_auth:
          description: Whether the connector uses password vault authentication. Read-only.
          type: boolean
          readOnly: true
        credential_path_id:
          description: The DCT UUID of the credential path record for password vault auth.
          type: string
        platform:
          description: This database or file connection type associated with the connector
          type: string
          example: ORACLE
        data_connection_id:
          description: The ID of the associated DataConnection.
          type: string
          example: data-connection-1
        account_id:
          description: The ID of the account who created this connector.
          type: integer
          format: int64
          readOnly: true
          example: 1
        account_name:
          description: The account name of the DCT user who created this connector.
          type: string
          readOnly: true
          example: John Doe
        dct_managed:
          description: Whether this connector is managed by DCT or not.
          type: boolean
          readOnly: true
        job_orchestrator_id:
          description: The ID of the job orchestrator that is associated with this connector.
          type: string
        job_orchestrator_name:
          description: The name of the job orchestrator that is associated with this connector.
          type: string
        file_reference_id:
          description: The reference uri/id of the connection-properties file used by the connector.
          type: string
        owning_entity_id:
          description: The ID of the owning entity, if any.
          type: string
          readOnly: true
        owning_entity_name:
          description: The name of the owning entity, if any.
          type: string
          readOnly: true
        owning_entity_type:
          description: The type of the owning entity, if any.
          type: string
          enum:
          - PAAS_INSTANCE
          readOnly: true
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
      example:
        id: 1-database-123
        name: connector-name
        engine_id: 123
        type: DATABASE
        hostname: database_server.example.com
        database_type: POSTGRES
        schema_name: public
        database_name: public
        port: 5432
        username: user-123
        kerberos_auth: false
        service_principal: krbuser
    DeleteTag:
      type: object
      properties:
        key:
          description: Key of the tag
          type: string
          minLength: 1
          maxLength: 4000
          example: key-1
        value:
          description: Value of the tag
          type: string
          minLength: 1
          maxLength: 4000
          example: value-1
        tags:
          description: List of tags to be deleted
          type: array
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Tag'
    CreateMaskingJobRequest:
      title: CreateMaskingJobRequest
      type: object
      description: Parameters to create a MaskingJob.
      properties:
        name:
          description: The name to give the Masking Job.
          type: string
          example: My favorite MaskingJob
        description:
          description: The description of the Job (Hyperscale Job only).
          type: string
          example: Job for app finance DB
        job_type:
          type: string
          description: The type of Job.
          enum:
          - HYPERSCALE
          example: HYPERSCALE
        hyperscale_instance_id:
          description: The ID of the HyperscaleInstance to create this Job on (Hyperscale Job only).
          type: string
          example: hyperscale-123
        source_masking_job_id:
          description: The ID of the Masking Job to use as the source (Hyperscale Job only).
          type: string
          example: masking-job-123
        hyperscale_source_connector_username:
          description: The username to set for the Source Connector that will be imported (Hyperscale Job only).
          type: string
          example: db-user-123
        hyperscale_source_connector_password:
          x-dct-toolkit-credential-field: true
          description: The password to set for the Source Connector that will be imported (Hyperscale Job only).
          type: string
          example: dp-pass-123
        hyperscale_target_connector_username:
          description: The username to set for the Target Connector that will be imported (Hyperscale Job only).
          type: string
          example: db-user-123
        hyperscale_target_connector_password:
          x-dct-toolkit-credential-field: true
          description: The password to set for the Target Connector that will be imported (Hyperscale Job only).
          type: string
          example: dp-pass-123
        mount_point_id:
          description: The ID of the MountPoint to use for the resulting dataset (Hyperscale Job only).
          type: string
          example: mount-point-123
        unload_split:
          description: The number of unloaded files to be generated from the source database (Hyperscale Job only).
          type: integer
