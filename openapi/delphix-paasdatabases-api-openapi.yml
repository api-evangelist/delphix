openapi: 3.0.0
info:
  title: Delphix DCT Algorithms PaaSDatabases API
  version: 3.28.0
  description: Delphix DCT API
  contact:
    name: Delphix Support
    url: https://portal.perforce.com/s/
    email: support@delphix.com
servers:
- url: /dct/v3
security:
- ApiKeyAuth: []
tags:
- name: PaaSDatabases
paths:
  /paas-databases:
    get:
      summary: List all PaaS Databases.
      operationId: get_paas_databases
      tags:
      - PaaSDatabases
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/paasDatabaseSortParam'
      - $ref: '#/components/parameters/permission'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                title: ListPaaSDatabasesResponse
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PaaSDatabase'
                  response_metadata:
                    $ref: '#/components/schemas/PaginatedResponseMetadata'
    post:
      summary: Provision a new PaaS Database
      operationId: provision_paas_database
      tags:
      - PaaSDatabases
      requestBody:
        content:
          application/json:
            schema:
              x-body-name: provision_paas_db_parameter
              $ref: '#/components/schemas/ProvisionPaaSDatabaseParameters'
        description: The parameters to provision a PaaS Database.
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                title: ProvisionPaaSDatabaseResponse
                properties:
                  paas_database_id:
                    type: string
                    description: The ID of the provisioned PaaS Database.
                  job:
                    $ref: '#/components/schemas/Job'
  /paas-databases/provision_from_bookmark:
    post:
      summary: Provision a new PaaS Database from a bookmark
      operationId: provision_paas_database_from_bookmark
      tags:
      - PaaSDatabases
      requestBody:
        content:
          application/json:
            schema:
              x-body-name: provision_paas_db_from_bookmark_parameter
              $ref: '#/components/schemas/ProvisionPaaSDatabaseFromBookmarkParameters'
        description: The parameters to provision a PaaS Database from a bookmark.
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                title: ProvisionPaaSDatabaseFromBookmarkResponse
                properties:
                  paas_database_id:
                    type: string
                    description: The ID of the provisioned PaaS Database.
                  job:
                    type: object
                    $ref: '#/components/schemas/Job'
  /paas-databases/{paaSDatabaseId}/bookmarks:
    parameters:
    - $ref: '#/components/parameters/paaSDatabaseIdParam'
    get:
      summary: List Bookmarks compatible with this PaaS Database.
      operationId: get_bookmarks_by_paas_database
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/bookmarksSortParam'
      tags:
      - PaaSDatabases
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                title: ListBookmarksByPaaSDatabaseResponse
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Bookmark'
                  response_metadata:
                    $ref: '#/components/schemas/PaginatedResponseMetadata'
  /paas-databases/{paaSDatabaseId}/bookmarks/search:
    parameters:
    - $ref: '#/components/parameters/paaSDatabaseIdParam'
    post:
      summary: Search Bookmarks compatible with this PaaS Database.
      operationId: search_bookmarks_by_paas_database
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/bookmarksSortParam'
      tags:
      - PaaSDatabases
      x-filterable:
        fields:
          id:
            type: string
          name:
            type: string
          paas_databases:
            type: array[object]
            fields:
              paas_database_id:
                type: string
              paas_database_name:
                type: string
              paas_snapshot_id:
                type: string
              data_timestamp:
                type: date-time
          creation_date:
            type: date-time
          retention:
            type: integer
          expiration:
            type: date
          data_timestamp:
            type: date-time
          tags:
            type: array[object]
            fields:
              key:
                type: string
              value:
                type: string
      requestBody:
        $ref: '#/components/requestBodies/SearchBody'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                title: SearchBookmarksByPaaSDatabaseResponse
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Bookmark'
                  response_metadata:
                    $ref: '#/components/schemas/PaginatedResponseMetadata'
  /paas-databases/{paaSDatabaseId}/refresh_from_bookmark:
    post:
      summary: Refresh a PaaS Database from bookmark
      operationId: refresh_paas_database_from_bookmark
      tags:
      - PaaSDatabases
      parameters:
      - $ref: '#/components/parameters/paaSDatabaseIdParam'
      requestBody:
        content:
          application/json:
            schema:
              x-body-name: refresh_paas_db_from_bookmark_parameter
              $ref: '#/components/schemas/RefreshPaaSDatabaseFromBookmarkParameters'
        description: The parameters to refresh a PaaS Database from a bookmark.
        required: true
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                title: RefreshPaaSDatabasesFromBookmarkResponse
                properties:
                  job:
                    description: The job object.
                    type: object
                    $ref: '#/components/schemas/Job'
  /paas-databases/search:
    post:
      summary: Search for PaaS Databases.
      operationId: search_paas_databases
      tags:
      - PaaSDatabases
      x-filterable:
        fields:
          id:
            type: string
          name:
            type: string
          plugin_id:
            type: string
          instance_id:
            type: string
          cloud_account_id:
            type: string
          cloud_account_name:
            type: string
          parent_snapshot_id:
            type: string
          parent_database_id:
            type: string
          status:
            type: string
          runtime_status:
            type: string
          connection_strings:
            type: array
            items: string
          database_engine:
            type: string
          database_engine_version:
            type: string
          compliance_connector_id: null
          is_encrypted:
            type: boolean
          platform_type:
            type: string
          platform_version:
            type: string
          owner:
            type: string
          root_database_id:
            type: string
          size_bytes:
            type: integer
          size_measurement_time:
            type: string
          size_measurement_source:
            type: string
          tags:
            type: array[object]
            fields:
              key:
                type: string
              value:
                type: string
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/paasDatabaseSortParam'
      - $ref: '#/components/parameters/permission'
      requestBody:
        $ref: '#/components/requestBodies/SearchBody'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                title: SearchPaaSDatabasesResponse
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PaaSDatabase'
                  response_metadata:
                    $ref: '#/components/schemas/PaginatedResponseMetadata'
  /paas-databases/{paaSDatabaseId}:
    parameters:
    - $ref: '#/components/parameters/paaSDatabaseIdParam'
    get:
      summary: Get a PaaS Database by ID.
      operationId: get_paas_database_by_id
      tags:
      - PaaSDatabases
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaaSDatabase'
  /paas-databases/{paaSDatabaseId}/delete:
    post:
      summary: Delete a PaaS Database
      operationId: delete_paas_database
      tags:
      - PaaSDatabases
      parameters:
      - $ref: '#/components/parameters/paaSDatabaseIdParam'
      requestBody:
        content:
          application/json:
            schema:
              x-body-name: delete_paas_db_parameter
              $ref: '#/components/schemas/DeletePaaSDatabaseParameters'
        description: The parameters to delete a PaaS Database.
        required: false
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                title: DeletePaaSDatabaseResponse
                properties:
                  job:
                    $ref: '#/components/schemas/Job'
  /paas-databases/{paaSDatabaseId}/execute-compliance-job:
    post:
      summary: Execute the compliance job for a PaaS Database
      operationId: execute_paas_database_compliance_job
      tags:
      - PaaSDatabases
      parameters:
      - $ref: '#/components/parameters/paaSDatabaseIdParam'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                title: ExecutePaaSDatabaseComplianceJobResponse
                properties:
                  job:
                    description: The initiated job.
                    $ref: '#/components/schemas/Job'
  /paas-databases/{paaSDatabaseId}/create-compliance-connector:
    post:
      summary: Create a new compliance connector for the PaaS Database.
      operationId: create_paas_database_compliance_connector
      tags:
      - PaaSDatabases
      parameters:
      - $ref: '#/components/parameters/paaSDatabaseIdParam'
      requestBody:
        content:
          application/json:
            schema:
              x-body-name: create_paas_db_connector_parameter
              $ref: '#/components/schemas/CreatePaaSDatabaseConnectorParameters'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                title: CreatePaaSDatabaseConnectorResponse
                properties:
                  job:
                    description: The job object.
                    $ref: '#/components/schemas/Job'
  /paas-databases/{paaSDatabaseId}/refresh:
    post:
      summary: Refresh a PaaS Database
      operationId: refresh_paas_database
      tags:
      - PaaSDatabases
      parameters:
      - $ref: '#/components/parameters/paaSDatabaseIdParam'
      requestBody:
        content:
          application/json:
            schema:
              x-body-name: refresh_paas_db_parameter
              $ref: '#/components/schemas/RefreshPaaSDatabaseParameters'
        description: The parameters to refresh a PaaS Database.
        required: true
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                title: RefreshPaaSDatabasesResponse
                properties:
                  job:
                    $ref: '#/components/schemas/Job'
  /paas-databases/{paaSDatabaseId}/de-provision:
    post:
      summary: De-provision a PaaS Database, meaning that the database object will remain in DCT, along with its permissions, tags, snapshots, ... but the database will no longer be running. If the current database data must be preserved, take a snapshot before de-provisioning.
      operationId: deprovision_paas_database
      tags:
      - PaaSDatabases
      parameters:
      - $ref: '#/components/parameters/paaSDatabaseIdParam'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                title: DeprovisionPaaSDatabasesResponse
                properties:
                  job:
                    description: The job object.
                    $ref: '#/components/schemas/Job'
  /paas-databases/{paaSDatabaseId}/re-provision:
    post:
      summary: Re-provision a PaaS Database which has previously been de-provisioned. The provision parameters specified at provisioning time will be respected, with the exception of the timestamp or snapshot id to re-provision from.
      operationId: reprovision_paas_database
      tags:
      - PaaSDatabases
      requestBody:
        content:
          application/json:
            schema:
              x-body-name: reprovision_paas_db_parameter
              $ref: '#/components/schemas/ReProvisionPaaSDatabaseParameters'
        description: The parameters to re-provision a PaaS Database.
        required: true
      parameters:
      - $ref: '#/components/parameters/paaSDatabaseIdParam'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                title: ReprovisionPaaSDatabaseResponse
                properties:
                  job:
                    description: The job object.
                    $ref: '#/components/schemas/Job'
  /paas-databases/{paaSDatabaseId}/tags:
    parameters:
    - $ref: '#/components/parameters/paaSDatabaseIdParam'
    post:
      tags:
      - PaaSDatabases
      summary: Create tags for a PaaS Database.
      operationId: create_paas_database_tags
      requestBody:
        content:
          application/json:
            schema:
              x-body-name: paas_database_tags
              $ref: '#/components/schemas/CloudTagsRequest'
        description: Tags information for PaaS Database.
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudTagsResponse'
    get:
      tags:
      - PaaSDatabases
      summary: Get tags for a PaaS Database.
      operationId: get_paas_database_tags
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudTagsResponse'
  /paas-databases/{paaSDatabaseId}/tags/delete:
    parameters:
    - $ref: '#/components/parameters/paaSDatabaseIdParam'
    post:
      tags:
      - PaaSDatabases
      summary: Delete tags for a PaaS Database.
      operationId: delete_paas_database_tags
      requestBody:
        $ref: '#/components/requestBodies/DeleteCloudTags'
      responses:
        '204':
          description: No Content
components:
  parameters:
    paasDatabaseSortParam:
      name: sort
      in: query
      description: 'The field to sort results by. A property name with a prepended ''-'' signifies descending order.

        '
      required: false
      schema:
        type: string
        enum:
        - id
        - -id
        - name
        - -name
        - plugin_id
        - -plugin_id
        - cloud_account_id
        - -cloud_account_id
        - cloud_account_name
        - -cloud_account_name
        - status
        - -status
        - runtime_status
        - -runtime_status
        - compliance_connector_id
        - -compliance_connector_id
        - database_engine
        - -database_engine
        - database_engine_version
        - -database_engine_version
        - instance_id
        - -instance_id
        - size_bytes
        - -size_bytes
        - size_measurement_time
        - -size_measurement_time
        - size_measurement_source
        - -size_measurement_source
        - root_database_id
        - -root_database_id
        nullable: true
        example: name
    paaSDatabaseIdParam:
      in: path
      name: paaSDatabaseId
      required: true
      schema:
        type: string
        minLength: 1
      description: The ID of the PaaS Database.
    bookmarksSortParam:
      name: sort
      in: query
      description: The field to sort results by. A property name with a prepended '-' signifies descending order.
      example: id
      required: false
      schema:
        type: string
        enum:
        - id
        - -id
        - name
        - -name
        - creation_date
        - -creation_date
        - vdb_ids
        - -vdb_ids
        - retention
        - -retention
        - expiration
        - -expiration
        - data_timestamp
        - -data_timestamp
        - timeflow_id
        - -timeflow_id
        - location
        - -location
        - vdb_group_name
        - -vdb_group_name
        - namespace_id
        - -namespace_id
        - namespace_name
        - -namespace_name
        - primary_object_id
        - -primary_object_id
        - primary_engine_id
        - -primary_engine_id
        - primary_engine_name
        - -primary_engine_name
        - primary_bookmark_expiration
        - -primary_bookmark_expiration
        nullable: true
        example: name
    permission:
      name: permission
      in: query
      description: Restrict the objects, which are allowed.
      example: READ
      schema:
        type: array
        items:
          $ref: '#/components/schemas/PermissionEnum'
      style: form
      explode: true
    limit:
      name: limit
      in: query
      description: Maximum number of objects to return per query. The value must be between 1 and 1000. Default is 100.
      example: 50
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
    cursor:
      name: cursor
      in: query
      description: Cursor to fetch the next or previous page of results. The value of this property must be extracted from the 'prev_cursor' or 'next_cursor' property of a PaginatedResponseMetadata which is contained in the response of list and search API endpoints.
      schema:
        type: string
        minLength: 1
        maxLength: 4096
  schemas:
    Tag:
      type: object
      required:
      - key
      - value
      properties:
        key:
          description: Key of the tag
          type: string
          minLength: 1
          maxLength: 4000
          example: key-1
        value:
          description: Value of the tag
          type: string
          minLength: 1
          maxLength: 4000
          example: value-1
    BookmarkPaaSDatabases:
      description: PaaS Database id and name associated with bookmark.
      type: object
      properties:
        paas_database_id:
          description: The PaaS Database id.
          type: string
          example: paas-database-id-1
        paas_database_name:
          description: The PaaS Database name.
          type: string
          example: paas-database-name
        root_parent_id:
          description: The root of the PaaS Database.
          type: string
          example: paas-instance-id-1
        paas_snapshot_id:
          description: The PaaS Snapshot id.
          type: string
          example: 1-SNAP-1
        data_timestamp:
          description: The timestamp of the PaaS Snapshot.
          type: string
          format: date-time
          example: '2021-05-01T08:51:34.148000+00:00'
    ProvisionPaaSDatabaseFromBookmarkParameters:
      description: Parameters to provision a PaaS Database from bookmark.
      allOf:
      - $ref: '#/components/schemas/ProvisionPaaSDatabaseBaseParameters'
      - type: object
        required:
        - name
        - bookmark_id
        properties:
          bookmark_id:
            description: The ID of the PaaS Database bookmark to provision from.
            type: string
            example: bookmark-123
    PaaSDatabase:
      description: A PaaS Database.
      type: object
      properties:
        id:
          description: The PaaS Database object entity ID.
          type: string
          example: db-123
        name:
          description: The PaaS Database name.
          type: string
          example: my-db-123
        plugin_id:
          description: Id of the PaaS plugin which manages this Database.
          type: string
          example: plugin-123
        is_snapshot_operation_target:
          description: Whether this PaaS Database can be the target of a DCT snapshot operation.
          type: boolean
        instance_id:
          description: Id of the PaaS Instance of this Database.
          type: string
          example: instance-123
        instance_name:
          description: Name of the PaaS Instance of this Database.
          type: string
          example: my-instance-123
        cloud_account_id:
          description: Id of the Cloud Account to which this Database belongs.
          type: string
          example: environment-123
        cloud_account_name:
          description: Name of the Cloud Account to which this Database belongs.
          type: string
          example: AWS-US-EAST-1
        database_engine:
          description: Name of the database engine.
          type: string
          example: Azure SQL Server
        database_engine_version:
          description: Version of the database engine.
          type: string
          example: 19.1.2
        status:
          description: The management status of this PaaS Database. DISCOVERED means the database has been found by DCT but is not yet under DCT management. DCT_MANAGED means the database is actively managed by DCT. ROOT means the database serves as the root source for DCT-managed child databases.
          type: string
          enum:
          - DISCOVERED
          - DCT_MANAGED
          - ROOT
        runtime_status:
          description: Runtime status of the PaaS Database.
          type: string
          enum:
          - CREATING
          - FAILED
          - RUNNING
          - DEPROVISIONED
          - STOPPED
          - DELETED_ROOT_SOURCE
          - REFRESHING
        connection_strings:
          description: Connection strings (such as JDBC URLs) for applications to connect to the database.
          type: array
          items:
            type: string
        parent_database_id:
          description: The ID of the parent PaaS Database, if this is a child database.
          type: string
          example: my-db-123
        parent_database_name:
          description: The name of the parent PaaS Database, if this is a child database.
          type: string
          example: my-parent-db
        root_database_id:
          description: The ID of the root PaaS Database, if this is a managed database.
          type: string
          example: my-root-123
        root_database_name:
          description: The name of the root PaaS Database, if this is a managed database.
          type: string
          example: my-root-db
        parent_snapshot_id:
          description: The ID of the parent PaaS Snapshot, if this is a child database.
          type: string
          example: my-snapshot-123
        is_encrypted:
          description: Whether this database is encrypted or not.
          type: boolean
          example: true
        compliance_connector_id:
          description: ID of the compliance connector created for this PaaS Database if any.
          type: string
          example: 123-connector-456
        database_type:
          description: The type of database.
          type: string
          enum:
          - ORACLE
          - RDS_POSTGRES
          - MSSQL
        owner:
          description: The owner or responsible party for this database, typically derived from metadata or tags.
          type: string
        created_time:
          description: The timestamp when the database instance was created, in ISO 8601 date-time format.
          type: string
          format: date-time
        size_bytes:
          description: The size of the database in bytes.
          type: integer
          format: int64
        size_measurement_time:
          description: The timestamp when the size of the database was retrieved, in ISO 8601 date-time format.
          type: string
          format: date-time
        size_measurement_source:
          description: The source from where the size was retrieved.
          type: string
        current_timeflow_id:
          description: The ID of the current active PaaS Timeflow for this Database, if the database is live.
          type: string
          example: paas-timeflow-abc123
        tags:
          type: array
          items:
            $ref: '#/components/schemas/CloudTag'
    CreatePaaSDatabaseConnectorParameters:
      description: Parameters to create a PaaS Database compliance connector.
      type: object
      required:
      - engine_id
      - schema_name
      properties:
        engine_id:
          type: string
          minLength: 1
          maxLength: 256
        masking_environment_id:
          type: string
          minLength: 1
          maxLength: 256
        schema_name:
          type: string
          minLength: 1
          maxLength: 2048
        username:
          description: The username this Connector will use to connect to the database.
          type: string
        password:
          x-dct-toolkit-credential-field: true
          description: The password this Connector will use to connect to the database.
          type: string
    VirtualizationTaskEvent:
      deprecated: true
      properties:
        message_details:
          type: string
    BookmarkVDBs:
      description: VDB id and name associated with bookmark.
      type: object
      properties:
        vdb_id:
          description: The VDB id.
          type: string
          example: vdb-id-1
        vdb_name:
          description: The VDB name.
          type: string
          example: vdb-name
        snapshot_id:
          description: The snapshot id.
          type: string
          example: 1-SNAP-1
        source_data_timestamp:
          description: The timestamp of origin timeline location.
          type: string
          format: date-time
          example: '2021-05-01T08:51:34.148000+00:00'
        root_parent_id:
          description: The root of the VDB.
          type: string
          example: 1-DBCONTAINER-1
        timeflow_id:
          description: The timeflow id of the snapshot.
          type: string
        data_timestamp:
          description: The bookmark timestamp of the VDB.
          type: string
          format: date-time
    CloudTagsResponse:
      type: object
      properties:
        tags:
          description: Array of tags with key value pairs
          type: array
          items:
            $ref: '#/components/schemas/CloudTag'
    CloudTag:
      type: object
      required:
      - key
      - value
      properties:
        key:
          description: Key of the tag
          type: string
          minLength: 1
          maxLength: 4000
          example: key-1
        value:
          description: Value of the tag
