    ConnectionProperty:
      description: Connection property.
      type: object
      properties:
        name:
          description: The property name.
          type: string
          example: oracle.jdbc.LoginTimeout
        value:
          description: The property value
          type: string
          example: '30'
        description:
          description: The property description.
          type: string
          example: Login timeout in seconds
        edited:
          description: >-
            Whether this property has been set through connection properties
            file.
          type: boolean
          example: true
    ExecutionStatus:
      description: The status of a masking or discovery job.
      type: string
      enum:
        - PENDING
        - QUEUED
        - RUNNING
        - CANCELLED
        - FAILED
        - SUCCEEDED
        - WARNING
        - WAITING
      example: RUNNING
    ExecutionStatusReason:
      description: The reason for the status of a compliance job collection execution.
      type: string
      enum:
        - NONE
        - JOB_FAILURE
        - RESOURCE_UNREACHABLE
        - DCT_JOB_CANCEL
        - ENGINE_JOB_CANCEL
        - JOB_MISSING
      example: JOB_MISSING
    Execution:
      description: The execution of a masking or discovery job.
      type: object
      properties:
        id:
          description: The Execution entity ID.
          type: string
          example: 414ed52c-fa89-455d-9fb9-9c2fa5115f80
        engine_id:
          description: The ID of the engine where this execution ran.
          type: string
          example: '1'
        hyperscale_instance_id:
          type: string
        engine_name:
          description: The name of the engine where this execution ran.
          type: string
          example: prod01
        job_orchestrator_id:
          description: >-
            The ID of the job orchestrator that is associated with this
            execution.
          type: string
        job_orchestrator_name:
          description: >-
            The name of the job orchestrator that is associated with this
            execution.
          type: string
        masking_job_id:
          description: The ID of the masking job that is being executed.
          type: string
          example: '2'
        masking_job_name:
          description: The name of the masking job that is being executed.
          type: string
          example: finance-masking-job
        compliance_job_type:
          description: The type of the compliance job being executed.
          type: string
          enum:
            - MASKING
            - DISCOVERY
            - TOKENIZATION
            - REIDENTIFICATION
          example: MASKING
        dct_managed:
          description: Indicates whether this execution is for a DCT-managed masking job.
          type: boolean
          example: true
        source_connector_id:
          description: >-
            The ID of the source connector. This field is only used for
            multi-tenant jobs that are also on-the-fly.
          type: string
          example: 1-DATABASE-2
        target_connector_id:
          description: >-
            The ID of the target connector. This field is only used for
            multi-tenant jobs.
          type: string
          example: 1-DATABASE-3
        source_connector_name:
          description: >-
            The name of the source connector. This field is only used for
            multi-tenant jobs that are also on-the-fly.
          type: string
          example: source-database
        target_connector_name:
          description: >-
            The name of the target connector. This field is only used for
            multi-tenant jobs.
          type: string
          example: target-database
        status:
          $ref: '#/components/schemas/ExecutionStatus'
        rows_masked:
          description: >-
            The number of rows masked or profiled so far by this execution. This
            is not applicable for JSON file type.
          type: integer
          format: int64
          example: 1000
        rows_total:
          description: >-
            The total number of rows that this execution should mask. This value
            is set to -1 while the total row count is being calculated. This is
            not applicable for JSON file type.
          type: integer
          format: int64
          example: 5000
        bytes_processed:
          description: >-
            The number of bytes masked so far by this execution. This is only
            applicable for JSON file type.
          type: integer
          format: int64
          example: 500
        bytes_total:
          description: >-
            The total number of bytes that this execution should mask. This
            value is set to -1 while the total byte count is being calculated.
            This is only applicable for JSON file type.
          type: integer
          format: int64
          example: 5000000
        start_time:
          description: The date and time that this execution was started.
          type: string
          format: date-time
          example: '2021-05-01T09:51:34.148000+00:00'
        submit_time:
          description: The date and time that this execution was submitted.
          type: string
          format: date-time
          example: '2021-05-01T08:51:34.148000+00:00'
        end_time:
          description: The date and time that this execution completed.
          type: string
          format: date-time
          example: '2021-05-01T11:51:34.148000+00:00'
        run_duration:
          description: The time this execution spent running, in milliseconds.
          type: integer
          format: int64
          example: 4000
        queue_duration:
          description: The time this execution spent in the queue, in milliseconds.
          type: integer
          format: int64
          example: 1000
        total_duration:
          description: The total time this execution took, in milliseconds.
          type: integer
          format: int64
          example: 5000
        account_id:
          description: The account id of the DCT user who started this execution.
          type: integer
          format: int64
          example: 3
        account_name:
          description: The account name of the DCT user who started this execution.
          type: string
          example: username
        task_events:
          description: >-
            The progression of steps or events performed by this execution. Only
            available for executions on masking engines that are version
            6.0.14.0 and higher.
          type: array
          items:
            $ref: '#/components/schemas/TaskEvent'
          example:
            - event: Initializing
              status: SUCCEEDED
            - event: Job Completed
              status: FAILED
        hyperscale_task_events:
          type: array
          items:
            $ref: '#/components/schemas/HyperscaleTaskEvent'
        progress:
          description: >-
            Progress of the task (value between 0 and 1, Hyperscale executions
            only)
          type: number
          example: 0.34
        execution_components_total:
          description: The total number of execution components in this execution.
          type: integer
          format: int32
          example: 5
        execution_components_processed:
          description: >-
            The number of execution components processed so far in this
            execution.
          type: integer
          format: int32
          example: 3
        collection_execution_id:
          description: >-
            The id of the compliance job collection execution this execution is
            part of, if any
          type: string
          example: 54a0cbff-bdc6-49fd-8e71-e8b570524fe9
        data_collection_complete:
          description: >-
            Indicates whether all peripheral information associated with the
            execution, including execution components, execution events, logs
            and discovery results, has been fully collected and finalized.
          type: boolean
        owning_entity_id:
          description: The owning entity ID of the target connector.
          type: string
        owning_entity_type:
          description: The type of the owning entity, if any.
          type: string
          enum:
            - PAAS_INSTANCE
        hyperscale_engine_count:
          description: >-
            The number of hyperscale engines associated with this execution
            (Hyperscale executions only).
          type: integer
          format: int32
          example: 2
    HyperscaleTaskEvent:
      properties:
        name:
          type: string
          description: Name of the task (Unload, Masking, Load, Post-Load)
          example: Unload
        progress:
          description: progress of the task (between 0 and 1)
          type: number
          example: 0.34
        status:
          type: string
          enum:
            - CANCELLED
            - CANCEL_INITIATED
            - FAILED
            - RUNNING
            - SUCCEEDED
          example: FAILED
        processed_objects:
          description: The number of objects (tables) already processed by this task.
          type: integer
          format: int64
        processed_rows:
          description: The number of rows already processed by this task.
          type: integer
          format: int64
        processed_constraints:
          description: >-
            The number of constraints processed by this task (Post-load task
            only)
          type: integer
          format: int64
        total_constraints:
          description: >-
            The total number of constraints to be processed by this task
            (Post-load task only)
          type: integer
          format: int64
        processed_indexes:
          description: The number of indexes processed by this task (Post-load task only)
          type: integer
          format: int64
        total_indexes:
          description: >-
            The total number of indexes to be processed by this task (Post-load
            task only)
          type: integer
          format: int64
        processed_triggers:
          description: The number of triggered processed by this task (Post-load task only)
          type: integer
          format: int64
        total_triggers:
          description: >-
            The total number of triggers to be processed by this task (Post-load
            task only)
          type: integer
          format: int64
        start_time:
          description: The date and time that this task was started.
          type: string
          format: date-time
          example: '2022-01-02T05:11:24.148000+00:00'
        end_time:
          description: The date and time that this task completed.
          type: string
          format: date-time
          example: '2022-01-02T05:13:24.148000+00:00'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/HyperscaleTaskError'
    HyperscaleTaskError:
      properties:
        table_name:
          type: string
          description: >-
            the name of the table for which the error occurred, including the
            schema.
          example: public_schema.table_x
        error:
          type: string
          description: A textual description of the error.
    TaskEvent:
      description: A step or event performed by a masking execution.
      type: object
      properties:
        event:
          description: The steps or events a task will perform.
          type: string
          example: Job Completed
        status:
          description: The state of result of the task event.
          type: string
          enum:
            - CANCELLED
            - FAILED
            - QUEUED
            - RUNNING
            - SUCCEEDED
            - SKIPPED
            - NON_CONFORMANT
          example: SUCCEEDED
    ExecutionEvent:
      description: Events, such as warnings or errors, associated with job executions.
      type: object
      properties:
        id:
          description: The ExecutionEvent entity ID.
          type: string
          example: 1-EVENT-1
        execution_id:
          description: The ID of the execution.
          type: string
          example: 414ed52c-fa89-455d-9fb9-9c2fa5115f80
        execution_component_id:
          description: The ID of the execution component.
          type: string
          example: '123'
        event_type:
          description: The type of execution event.
          type: string
          enum:
            - JOB_ABORTED
            - UNMASKED_DATA
            - MASKING_FALLBACK
            - NONCONFORMANT_DATA_NULLIFICATION
            - FILE_PATTERN_NO_MATCH
            - DATA_FETCH_FAIL
          example: JOB_ABORTED
        severity:
          description: The severity of the execution event.
          type: string
          enum:
            - INFO
            - WARNING
            - CRITICAL
          example: INFO
        cause:
          description: The cause of the execution event.
          type: string
          enum:
            - UNHANDLED_EXCEPTION
            - IGNORED_EXCEPTION
            - PATTERN_MATCH_FAILURE
            - PREMASK_TYPE_CONVERSION_FAILURE
            - POSTMASK_TYPE_CONVERSION_FAILURE
            - EXTENDED_ALGORITHM_FAILURE
            - DRIVER_SUPPORT_TASK_FAILURE
            - DATA_NOT_FOUND_FAILURE
            - INVALID_JOB_CONFIGURATION
            - DATA_QUERY_TIMEOUT
            - SALESFORCE_BATCH_JOB_ERRORS
          example: UNHANDLED_EXCEPTION
        count:
          description: The number of times the execution event occurred.
          type: integer
          format: int64
          example: 1
        timestamp:
          description: The date and time that this execution event first occurred.
          type: string
          format: date-time
          example: '2023-03-20T08:51:34.148000+00:00'
        masked_object_name:
          description: >-
            The name of the column, field, or other object being masked when
            this event occurred, if applicable.
          type: string
          example: ssn
        algorithm_name:
          description: >-
            The name of the masking algorithm running when this event occurred,
            if applicable.
          type: string
          example: SsnTK
        exception_type:
          description: >-
            The Java class of the exception that triggered this event, if
            applicable.
          type: string
          example: SQLException
        exception_detail:
          description: >-
            The details associated with the Java exception that triggered this
            event, if applicable.
          type: string
          example: >-
            Listener refused the connection with the following error: ORA-12505,
            TNS:listener does not currently know of SID given in connect
            descriptor
    ExecutionLogsDownloadProperties:
      description: Common properties for log file download information.
      type: object
      properties:
        log:
          description: >
            The log file contents. If the log file is 100KB or smaller, the
            entire contents are returned.

            If the log file is larger than 100KB, the response is truncated to
            include either the last 1000 lines

            (if they fit within 100KB) or as many lines as fit within the 100KB
            limit.
          type: string
        download_status:
          description: >
            The status of downloading the log file from the engine to DCT.

            - COLLECTED: The log file has been successfully downloaded and is
            available.

            - FAILED: The log file failed to download from Compliance Node or
            Engine to DCT.

            - NOT_AVAILABLE: The log file was not available on Compliance Node
            or Engine.

            - DELETED: The log file has been deleted from DCT.
          type: string
          enum:
            - COLLECTED
            - FAILED
            - NOT_AVAILABLE
            - DELETED
          example: COLLECTED
        file_size:
          description: The size of the log file in bytes.
          type: integer
          format: int64
          example: 1024
        is_truncated:
          description: >-
            Whether the log content has been truncated because the file size
            exceeds 100KB. When true, only the last 1000 lines are included,
            subject to the 100KB limit.
          type: boolean
          example: false
        file_download_id:
          description: >-
            The ID of the file download record, which can be used to download
            the full log file via the file download API. Only present when
            download_status is COLLECTED.
          type: string
          example: 3a4b5c6d-1234-5678-abcd-ef0123456789
    ExecutionLog:
      description: A log containing warnings or errors associated with a job execution.
      allOf:
        - type: object
          properties:
            id:
              description: The ExecutionLog entity ID.
              type: string
