    CreateMaskingJobRequest:
      title: CreateMaskingJobRequest
      type: object
      description: Parameters to create a MaskingJob.
      properties:
        name:
          description: The name to give the Masking Job.
          type: string
          example: My favorite MaskingJob
        description:
          description: The description of the Job (Hyperscale Job only).
          type: string
          example: Job for app finance DB
        job_type:
          type: string
          description: The type of Job.
          enum:
            - HYPERSCALE
          example: HYPERSCALE
        hyperscale_instance_id:
          description: >-
            The ID of the HyperscaleInstance to create this Job on (Hyperscale
            Job only).
          type: string
          example: hyperscale-123
        source_masking_job_id:
          description: >-
            The ID of the Masking Job to use as the source (Hyperscale Job
            only).
          type: string
          example: masking-job-123
        hyperscale_source_connector_username:
          description: >-
            The username to set for the Source Connector that will be imported
            (Hyperscale Job only).
          type: string
          example: db-user-123
        hyperscale_source_connector_password:
          x-dct-toolkit-credential-field: true
          description: >-
            The password to set for the Source Connector that will be imported
            (Hyperscale Job only).
          type: string
          example: dp-pass-123
        hyperscale_target_connector_username:
          description: >-
            The username to set for the Target Connector that will be imported
            (Hyperscale Job only).
          type: string
          example: db-user-123
        hyperscale_target_connector_password:
          x-dct-toolkit-credential-field: true
          description: >-
            The password to set for the Target Connector that will be imported
            (Hyperscale Job only).
          type: string
          example: dp-pass-123
        mount_point_id:
          description: >-
            The ID of the MountPoint to use for the resulting dataset
            (Hyperscale Job only).
          type: string
          example: mount-point-123
        unload_split:
          description: >-
            The number of unloaded files to be generated from the source
            database (Hyperscale Job only).
          type: integer
          format: int64
          example: 4
        stream_size:
          description: >-
            The stream size to be used by the sqlldr oracle utility which
            specifies the size (in bytes) of the data stream sent from the
            client to the server (Hyperscale Job only).
          type: integer
          format: int64
          example: 65536
        retain_execution_data:
          description: >-
            Defines whether execution data will be stored after execution is
            complete (Hyperscale Job only).
          type: string
          enum:
            - 'NO'
            - ON_ERROR
            - ALWAYS
          example: false
        max_memory:
          description: >-
            Maximum memory, in MB, to be allocated for each Masking job
            (Hyperscale Job only).
          type: integer
          format: int32
          example: 1024
        min_memory:
          description: >-
            Minimum memory, in MB, to be allocated for each Masking job
            (Hyperscale Job only).
          type: integer
          format: int32
          example: 1024
        feedback_size:
          description: >-
            The granularity with which the masking engine provides updates on
            the progress of the masking job. For instance, a feedbackSize of
            50000 results in log updates whenever 50000 rows are processed
            during the masking phase (Hyperscale Job only).
          type: integer
          format: int32
          example: 10000
        stream_row_limit:
          description: >-
            The stream row limit constrains the total number of rows that may
            enter the job for each masking stream. Setting this value to 0
            allows unlimited rows into each stream, while leaving it blank will
            select a default limit based on job type (Hyperscale Job only).
          type: integer
          format: int32
          example: 0
        num_input_streams:
          description: >-
            Number of input streams to be configured for Masking Job (Hyperscale
            Job only).
          type: integer
          format: int32
          example: 4
        max_concurrent_source_connections:
          description: >-
            Maximum number of parallel connection that the Hyperscale instance
            can have with the source datasource (Hyperscale Job only).
          type: integer
          format: int32
          example: 32
        max_concurrent_target_connections:
          description: >-
            Maximum number of parallel connection that the Hyperscale instance
            can have with the target datasource (Hyperscale Job only).
          type: integer
          format: int32
          example: 32
        parallelism_degree:
          description: >-
            The degree of parallelism (DOP) per Oracle job to recreate the index
            in the post-load process (Hyperscale Job only).
          type: integer
          format: int32
          example: 4
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        make_current_account_owner:
          type: boolean
          default: true
          description: >-
            Whether the account creating this Masking job must be configured as
            owner of it (Hyperscale Job only).
