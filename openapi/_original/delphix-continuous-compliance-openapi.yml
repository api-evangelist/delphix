    ComplianceNode:
      description: A compliance node.
      type: object
      properties:
        id:
          description: The unique identifier of the compliance node.
          type: string
          example: a1b2c3d4-e5f6-7890-1234-567890abcdef
        name:
          description: The name of the compliance node.
          type: string
          example: My Compliance Node
        hostname:
          description: The hostname of the compliance node.
          type: string
          example: compliance.example.com
        insecure_ssl:
          description: >
            Allow connections to the compliance node over HTTPs without
            validating the TLS certificate. Even though

            the connection to the compliance node might be performed over HTTPs,
            setting this property eliminates

            the protection against a man-in-the-middle attach for connections to
            this node. Instead,

            consider configuring DCT with Certificate Authority certificates.
          type: boolean
          default: false
          example: false
        unsafe_ssl_hostname_check:
          description: >
            Ignore validation of the name associated to the TLS certificate when
            connecting to the compliance node over HTTPs.

            Setting this value must only be done if the TLS certificate of the
            compliance node does not match the hostname,

            and the TLS configuration of the compliance node cannot be fixed.
            Setting this property reduces the protection

            against a man-in-the-middle attack for connections to this
            compliance node.

            This is ignored if insecure_ssl is set.
          type: boolean
          default: false
          example: false
        username:
          description: The username for connecting to the compliance node.
          type: string
          example: user1
        password:
          x-dct-toolkit-credential-field: true
          description: The password for connecting to the compliance node.
          type: string
          example: secret
        creation_date:
          description: The date and time when the compliance node was created.
          type: string
          readOnly: true
          format: date-time
          example: '2024-06-01T08:51:34.148000+00:00'
        account_id:
          description: The ID of the account associated with the compliance node.
          type: integer
          format: int64
          readOnly: true
          example: 1
        account_name:
          description: The account name of the DCT user who created this compliance node.
          type: string
          readOnly: true
          example: username
        status:
          description: The status of the compliance node.
          type: string
          readOnly: true
          enum:
            - ONLINE
            - CONNECTION_ERROR
            - BAD_CREDENTIALS
          example: ONLINE
        status_details:
          type: string
          readOnly: true
          description: Additional details about the status of the compliance node.
          example: Connection successful
        job_orchestrator_id:
          description: The job orchestrator id associated with the compliance node.
          type: string
          example: f8e7d6c5-b4a3-2109-8765-43210fedcba9
        job_orchestrator_name:
          description: The job orchestrator name associated with the compliance node.
          type: string
          example: Job Orchestrator
        core_count:
          description: The number of CPU cores available on the compliance node.
          type: integer
          readOnly: true
          example: 8
        memory_for_jobs:
          description: >-
            The amount of memory (in MB) available for jobs on the compliance
            node.
          type: number
          readOnly: true
          example: 16384
        version:
          description: The version of the compliance node.
          type: string
          readOnly: true
          example: 1.0.0
        api_version:
          description: The API version of the compliance node.
          type: string
          readOnly: true
          example: v1
        hyperscale_instance_id:
          description: >-
            The ID of the hyperscale instance associated with the compliance
            node.
          type: string
          nullable: true
          example: f8e7d6c5-b4a3-2109-8765-43210fedcba9
        hyperscale_instance_name:
          description: >-
            The name of the hyperscale instance associated with the compliance
            node.
          type: string
          nullable: true
          example: Hyperscale Orchestrator
    MoveComplianceNodesToHyperscaleRequest:
