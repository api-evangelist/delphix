          description: The ID of the Hyperscale Dataset table or file.
          type: string
        schema_name:
          type: string
          description: Name of the table schema (Oracle/MSSql only).
        table_name:
          type: string
          description: Name of the table (Oracle/MSSql only).
        collection_name:
          type: string
          description: Name of the collection (MongoDB only).
        database_name:
          type: string
          description: Name of the database (MongoDB only).
        filter_key:
          description: The unique database column field to filter the source data.
          type: string
        column_array_rows:
          description: >-
            The number of column array rows to be used by the sqlldr oracle
            utility which determines the number of rows loaded before the stream
            buffer is built.
          type: integer
          format: int64
        unload_split:
          description: >-
            The number of unloaded files to be generated from the source
            database.
          type: integer
          format: int64
        stream_size:
          description: >-
            Long The stream size to be used by the sqlldr oracle utility which
            specifies the size (in bytes) of the data stream sent from the
            client to the server.
          type: integer
          format: int64
        end_of_record:
          description: >-
            The end of line character. Support values are \n, \r  and \r\n
            (Delimited files only).
          type: string
        delimiter:
          description: >-
            The single character length delimiter used in source files
            (Delimited files only).
          type: string
        enclosure:
          description: >-
            The single character length quote character used in the source files
            (Delimited files only).
          type: string
        enclosure_escape_character:
          description: >-
            The escape character used to escape quote characters (Delimited
            files only).
          type: string
        escape_enclosure_escape_character:
          description: >-
            Whether to escape the enclosure escape character (Delimited files
            only).
          type: boolean
        has_headers:
          description: >-
            Whether source files have header column names or not (Delimited
            files only). If set to true, format files with the same column names
            are created and the same can be used for the masking inventory. If
            set to false, the column names of pattern f0, f1, f2, and so on are
            used to create the format files for delimited file masking.
          type: boolean
        unique_source_files_identifier:
          description: >-
            This is the source key that maps the load-service and
            masking-service data sets with the unload-service data set
            (Delimited files only). Please ensure that this value is different
            for each HyperscaleDatasetTableOrFile.
          type: string
        source_files:
          description: >-
            List of all source files that need to be masked (Delimited files
            only). All files should have the same delimiter character and other
            helper characters. All files should have the same number of columns
            and same column names if it has a header line.
          type: array
          items:
            type: string
        perform_join:
          description: Whether the split files must be joined (Delimited files only).
          type: boolean
        masking_inventory:
          type: array
          description: DataSet information for masking inventory.
          items:
            type: object
            title: HyperscaleColumnOrField
            properties:
              field_name:
                description: Name of the field.
                type: string
              domain_name:
                description: The name of the domain assigned to this field.
                type: string
              algorithm_name:
                description: The name of the algorithm assigned to this field.
                type: string
              date_format:
                description: The format of the date assigned to this field.
                type: string
              algorithm_field_name:
                description: >-
                  The name of the algorithm field that is associated with this
                  algorithm.
                type: string
              algorithm_group_no:
                description: >-
                  The group number of the algorithm to identify a set of columns
                  associated with one instance of algorithm.
                type: integer
                format: int64
