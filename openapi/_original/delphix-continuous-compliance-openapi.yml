    SearchBody:
      x-skip-codegen-attr: description
      description: >
        A request body containing a filter expression. This enables searching

        for items matching arbitrarily complex conditions. The list of

        attributes which can be used in filter expressions is available

        in the x-filterable vendor extension.


        # Filter Expression Overview

        **Note: All keywords are case-insensitive**


        ## Comparison Operators

        | Operator | Description | Example |

        | --- | --- | --- |

        | CONTAINS | Substring or membership testing for string and list
        attributes respectively. | field3 CONTAINS 'foobar', field4 CONTAINS
        TRUE  |

        | IN | Tests if field is a member of a list literal. List can contain a
        maximum of 100 values | field2 IN ['Goku', 'Vegeta'] |

        | GE | Tests if a field is greater than or equal to a literal value |
        field1 GE 1.2e-2 |

        | GT | Tests if a field is greater than a literal value | field1 GT
        1.2e-2 |

        | LE | Tests if a field is less than or equal to a literal value |
        field1 LE 9000 |

        | LT | Tests if a field is less than a literal value | field1 LT 9.02 |

        | NE | Tests if a field is not equal to a literal value | field1 NE 42 |

        | EQ | Tests if a field is equal to a literal value | field1 EQ 42 |


        ## Search Operator

        The SEARCH operator filters for items which have any filterable

        attribute that contains the input string as a substring, comparison

        is done case-insensitively. This is not restricted to attributes with

        string values. Specifically `SEARCH '12'` would match an item with an

        attribute with an integer value of `123`.


        ## Logical Operators

        Ordered by precedence.

        | Operator | Description | Example |

        | --- | --- | --- |

        | NOT | Logical NOT (Right associative) | NOT field1 LE 9000 |

        | AND | Logical AND (Left Associative) | field1 GT 9000 AND field2 EQ
        'Goku' |

        | OR | Logical OR (Left Associative) | field1 GT 9000 OR field2 EQ
        'Goku' |


        ## Grouping

        Parenthesis `()` can be used to override operator precedence.


        For example:

        NOT (field1 LT 1234 AND field2 CONTAINS 'foo')


        ## Literal Values

        | Literal      | Description | Examples |

        | --- | --- | --- |

        | Nil | Represents the absence of a value | nil, Nil, nIl, NIL |

        | Boolean | true/false boolean | true, false, True, False, TRUE, FALSE |

        | Number | Signed integer and floating point numbers. Also supports
        scientific notation. | 0, 1, -1, 1.2, 0.35, 1.2e-2, -1.2e+2 |

        | String | Single or double quoted | "foo", "bar", "foo bar", 'foo',
        'bar', 'foo bar' |

        | Datetime | Formatted according to
        [RFC3339](https://datatracker.ietf.org/doc/html/rfc3339) |
        2018-04-27T18:39:26.397237+00:00 |

        | List | Comma-separated literals wrapped in square brackets | [0], [0,
        1], ['foo', "bar"] |


        ## Limitations

        - A maximum of 8 unique identifiers may be used inside a filter
        expression.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SearchBody'
          examples:
            nested:
              description: >
                An example of a nested Object comparison testing that at least
                one repository has a

                version which is equal to 19.0.0.
              summary: Nested Object Comparison
              value:
                filter_expression: repositories CONTAINS {version eq '19.0.0'}
            relative:
              description: |
                An example of a relative comparison testing that field1 has a
                value which is less than 123.
              summary: Relative comparison
              value:
                filter_expression: field1 LE 123
            nil:
              description: >
                An example of using nil to test for the absence of a value for
                field2.
              summary: Absence of an attribute value
              value:
                filter_expression: field2 EQ NIL
            non-nil:
              description: >
                An example of using nil to test for the existence of a value for
                field2.
              summary: Existence of an attribute value
              value:
                filter_expression: field2 NE NIL
            contains:
              description: |
                An example of using the 'CONTAINS' operator to check if
                field2 contains the string 'foo'. If field2 is string valued
                then this is checking if 'foo' is a substring of field2. If
                field2 is a list of strings then this is checking if 'foo'
                is a member of the list.
              summary: Use of the CONTAINS operator
              value:
                filter_expression: field2 CONTAINS 'foo'
            in:
              description: |
                An example of using the 'IN' operator to check if field1
                is an element of a list literal.
              summary: Use of the IN operator
              value:
                filter_expression: field1 IN [1, 2, 3]
            search:
              description: >
                An example of using the 'SEARCH' operator to retrieve all
                elements

                for which 'foo' is a substring of a filterable attribute.
              summary: Use of the SEARCH operator
              value:
                filter_expression: SEARCH 'foo'
            parenthesis:
              description: >
                An example of parenthesis being used to group operators &
                override

                operator precedence.
              summary: Overriding operator precedence
              value:
                filter_expression: >-
                  field1 LT 1234 AND (field2 CONTAINS 'foo' OR field3 CONTAINS
                  'bar')
security:
  - ApiKeyAuth: []
