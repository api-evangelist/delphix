    HyperscaleInstance:
      title: HyperscaleInstance
      type: object
      description: >-
        A registered Hyperscale instance's connection and authentication
        settings.
      required:
        - name
        - hostname
        - api_key
        - job_orchestrator_id
      properties:
        id:
          description: The Hyperscale instance entity ID.
          type: string
          readOnly: true
        name:
          description: The name of this hyperscale instance.
          type: string
        hostname:
          description: The hostname of this hyperscale instance.
          type: string
        data_type:
          $ref: '#/components/schemas/HyperscaleDataTypeEnum'
        creation_date:
          description: The date this hyperscale instance was registered.
          type: string
          format: date-time
        tags:
          description: The tags to be created for this hyperscale instance.
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        api_key:
          description: API key to connect to the hyperscale instance.
          type: string
        insecure_ssl:
          description: >
            Allow connections to the hyperscale instance over HTTPs without
            validating the TLS certificate. Even though

            the connection to the hyperscale instance might be performed over
            HTTPs, setting this property eliminates

            the protection against a man-in-the-middle attach for connections to
            this engine. Instead,

            consider configuring DCT with Certificate Authority certificates.
          type: boolean
          default: false
        unsafe_ssl_hostname_check:
          description: >
            Ignore validation of the name associated to the TLS certificate when
            connecting to the hyperscale instance over HTTPs.

            Setting this value must only be done if the TLS certificate of the
            hyperscale instance does not match the hostname,

            and the TLS configuration of the hyperscale instance cannot be
            fixed. Setting this property reduces the protection

            against a man-in-the-middle attack for connections to this
            hyperscale instance.

            This is ignored if insecure_ssl is set.
          type: boolean
          default: false
        status:
          description: The status of this hyperscale instance.
          type: string
          enum:
            - CREATED
            - DELETING
          nullable: true
          readOnly: true
        connection_status:
          description: The status of the connection to the hyperscale instance.
          type: string
          enum:
            - ONLINE
            - CONNECTION_ERROR
            - BAD_CREDENTIALS
          nullable: true
          readOnly: true
        connection_status_details:
          description: >-
            If set, details about the status of the connection to the hyperscale
            instance.
          type: string
          readOnly: true
        job_orchestrator_id:
          type: string
          description: >-
            The job orchestrator id that is associated with the hyperscale
            instance.
        job_orchestrator_name:
          description: The job orchestrator name associated with the hyperscale instance.
          type: string
        node_count:
          type: integer
          description: >-
            The Number of compliance nodes registered on Hyperscale Instance if
            instance is dct_managed.
        auto_calculate_unload_split:
          type: boolean
          default: true
          description: >-
            If set, hyperscale will auto calculate the no of splits required for
            masking job.
        consider_continuous_compliance_warning_event_as:
          type: string
          enum:
            - SUCCESS
            - FAILURE
          default: SUCCESS
          description: >-
            The flag to control behavior of Hyperscale Job execution on warning
            event in Continuous Compliance Job execution. Default behavior of
            Hyperscale Job on the WARNING status of Continuous Compliance Job
            execution, is to consider it as SUCCESS. One example of warning
            event in Continuous Compliance is masking non conformant data.
        create_all_indexes_with_nologging:
          type: boolean
          default: false
          description: Add all indexes with NOLOGGING as part of post load.
        disable_parallel_index_creation:
          type: boolean
          default: false
          description: >-
            Exclude indexes from combining with constraint and trigger groups as
            part of pre load.
        enable_all_constraints_with_novalidate:
          type: boolean
          default: false
          description: Enable all constraints with NOVALIDATE as part of post load.
        max_concurrent_source_connections:
          type: integer
          default: 30
          description: >-
            Maximum number of parallel connection that hyperscale can have with
            source datasource.
        max_concurrent_target_connections:
          type: integer
          default: 30
          description: >-
            Maximum number of parallel connection that hyperscale can have with
            target datasource.
        max_parallel_connections_per_table:
          type: integer
          default: 30
          description: >-
            Maximum number of parallel connection that per table per masking
            job.
        max_records_per_split:
          type: integer
          format: int64
          default: 30
          description: Maximum number of rows allowed per split file for job execution.
        max_split_per_connection:
          type: integer
          default: 4
          description: >-
            Maximum number of split files allowed per connection for job
            execution.
        parallelism_degree:
          type: integer
          default: 0
          description: Degree of parallelism for target database.
        retain_execution_data:
          type: string
          enum:
            - 'NO'
            - ON_ERROR
            - ALWAYS
          default: 'NO'
          description: >-
            Defines whether execution data will be stored after execution is
            complete. Enum having values- NO, ON_ERROR, ALWAYS.
        stream_size:
          type: integer
          default: 0
          description: >-
            The stream size to be used by sqlldr oracle utility which specifies
            the size (in bytes) of the data stream sent from the client to the
            server.
        column_array_rows:
          type: integer
          default: 0
          description: >-
            The number of column array rows to be used by sqlldr oracle utility
            which determines the number of rows loaded before the stream buffer
            is built.
        unload_split:
          type: integer
          default: 1
          description: >-
            The number of unloaded files to be generated from the source
            database.
