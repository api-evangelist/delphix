      description: A SQL script to be run before or after a compliance job.
      type: object
      required:
        - name
        - contents
      properties:
        name:
          description: The name of the SQL script.
          type: string
          example: pre_script.sql
        contents:
          description: The contents of the SQL script.
          type: string
          maxLength: 65535
    ComplianceJob:
      description: A compliance job.
      type: object
      properties:
        id:
          description: The Compliance Job entity ID.
          type: string
          readOnly: true
          example: compliance-job-1
        name:
          description: The name of this Compliance Job.
          type: string
          example: My favorite ComplianceJob
        rule_set_id:
          description: >-
            The ID of the Rule Set used by this Compliance Job (Standard Job
            only). For hyperscale jobs, see dataset_id.
          type: string
          example: uuid
        rule_set_name:
          description: >-
            The name of the Rule Set used by this Compliance Job (Standard Job
            only). For hyperscale jobs, see dataset_id.
          type: string
          example: my rule set
        connector_type:
          type: string
          description: >-
            The type of data being masked by this Job. If the Compliance Job is
            masking a database this is the type of the database (Standard Job
            only).
          example: MARIADB
        is_on_the_fly_masking:
          description: Whether this is an on-the-fly masking job (Standard Job only).
          type: boolean
          example: true
        is_multi_tenant:
          description: >-
            If true, this job must be executed using a connector that is
            different from the underlying connector associated with its ruleset.
          type: boolean
          example: false
        pre_script:
          $ref: '#/components/schemas/ComplianceJobScript'
        post_script:
          $ref: '#/components/schemas/ComplianceJobScript'
        creation_date:
          description: The date this ComplianceJob was created (Standard Job only).
          type: string
          format: date-time
          example: '2022-11-30T08:51:34.148000+00:00'
        last_completed_execution_date:
          description: The date this ComplianceJob was last executed to completion.
          type: string
          format: date-time
          example: '2022-11-30T09:51:34.148000+00:00'
        hyperscale_state:
          description: The hyperscale capability/state for the compliance job.
          type: string
          enum:
            - NOT_AVAILABLE
            - AVAILABLE
            - ENABLED
          example: NOT_AVAILABLE
        last_execution_status:
          $ref: '#/components/schemas/ExecutionStatus'
        last_execution_id:
          description: The ID of this ComplianceJob's last execution.
          type: string
          example: 00e38996-7da2-4827-8f3e-0503234de537
        last_execution_start_time:
          description: The start time of the most recent execution of this compliance job.
          type: string
          format: date-time
          example: '2022-11-30T09:51:34.148000+00:00'
        last_execution_run_time:
          description: >-
            The run time of the most recent execution of this compliance job in
            ms.
          type: integer
          format: int64
          example: 31000
        on_the_fly_source_connector_id:
          type: string
          description: The ID of the OTF source connector for this job
          nullable: true
        on_the_fly_source_connector_name:
          type: string
          description: The name of the OTF source connector for this job
          nullable: true
        on_the_fly_source_connector_type:
          type: string
          description: The type of the OTF source connector for this job
          nullable: true
        type:
          type: string
          description: The type of compliance job.
          enum:
            - MASKING
            - DISCOVERY
            - TOKENIZATION
            - REIDENTIFICATION
          example: MASKING
        execution_type:
          type: string
          description: The execution type of this Job.
          enum:
            - STANDARD
            - HYPERSCALE
          example: STANDARD
        hyperscale_instance_id:
          description: The ID of the Hyperscale instance of this job (Hyperscale Job only).
          type: string
          example: abc
        description:
          description: Description of the job (Hyperscale Job only).
          type: string
          example: Job for app finance
        dataset_id:
          description: Dataset of the Hyperscale Job (Hyperscale Job only).
          type: string
          example: dataset-123
        retain_execution_data:
          description: >-
            Defines whether execution data will be stored after execution is
            complete (Hyperscale Job only).
          type: string
          enum:
            - 'NO'
            - ON_ERROR
            - ALWAYS
          example: false
        max_memory:
          description: >-
            The maximum amount of memory, in MB, that the compliance job can
            consume during execution. A value of 0 uses the default max memory
            set in application settings.
          type: integer
          format: int32
          example: 1024
          minimum: 0
          default: 0
        min_memory:
          description: >-
            The minimum amount of memory, in MB, that the compliance job can
            consume during execution.
          type: integer
          format: int32
          example: 1024
          minimum: 0
        feedback_size:
          description: >-
            The granularity with which the system provides updates on the
            progress of the compliance job. For instance, a feedback size of
            50000 results in log updates whenever 50000 rows are processed
            during the masking phase.
          type: integer
          format: int32
          minimum: 1
          example: 50000
        stream_row_limit:
          description: >-
            This value constrains the total number of rows that may enter the
            job for each masking stream. A value of 0 means unlimited. A value
            of -1 selects the default value. The default value for this setting
            varies by job type. The minimum explicit value allowed is 20.
          type: integer
          format: int32
          minimum: -1
          example: 20000
        num_input_streams:
          description: >-
            This field controls the amount of parallelism that the masking job
            uses to extract out the data to be masked.
          type: integer
          format: int32
          minimum: 1
          default: 1
          example: 4
        max_concurrent_source_connections:
          description: >-
            Maximum number of parallel connection that the Hyperscale instance
            can have with the source datasource (Hyperscale Job only).
          type: integer
          format: int32
          example: 32
        max_concurrent_target_connections:
          description: >-
            Maximum number of parallel connection that the Hyperscale instance
            can have with the target datasource (Hyperscale Job only).
          type: integer
          format: int32
          example: 32
        hyperscale_enabled:
          type: boolean
          example: true
          description: >-
            This flag indicates if this compliance job is enabled for Hyperscale
            processing.
        auto_calculate_unload_split:
          type: boolean
          example: true
          description: >-
            If set, hyperscale will auto calculate the no of splits required for
            masking job.
        consider_continuous_compliance_warning_event_as:
          type: string
          enum:
            - SUCCESS
            - FAILURE
          example: SUCCESS
          description: >-
            The flag to control behavior of Hyperscale Job execution on warning
            event in Continuous Compliance Job execution. Default behavior of
            Hyperscale Job on the WARNING status of Continuous Compliance Job
            execution, is to consider it as SUCCESS. One example of warning
            event in Continuous Compliance is masking non conformant data.
        create_all_indexes_with_nologging:
          type: boolean
          example: false
          description: Add all indexes with NOLOGGING as part of post load.
        disable_parallel_index_creation:
          type: boolean
          example: false
          description: >-
            Exclude indexes from combining with constraint and trigger groups as
            part of pre load.
        enable_all_constraints_with_novalidate:
          type: boolean
          example: false
          description: Enable all constraints with NOVALIDATE as part of post load.
        max_parallel_connections_per_table:
          type: integer
          example: 10
          description: >-
            Maximum number of parallel connection that per table per masking
            job.
        max_records_per_split:
          type: integer
          format: int64
          example: 100000000
          description: Maximum number of rows allowed per split file for job execution.
        max_split_per_connection:
          type: integer
          example: 4
          description: >-
            Maximum number of split files allowed per connection for job
            execution.
        parallelism_degree:
          description: >-
            The degree of parallelism (DOP) per Oracle job to recreate the index
            in the post-load process (Hyperscale Job only).
          type: integer
          format: int32
          example: 4
        source_masking_job_id:
          description: >-
            The ID of the MaskingJob that was used as the source to create this
            job (Hyperscale Job only).
          type: string
          example: masking-job-0
        engine_id:
          description: The engine on which this job resides (Standard Job only).
          type: string
          example: 1
        engine_name:
          description: >-
            The name of the engine on which this job resides (Standard Job
            only).
          type: string
          example: masking-engine-1
        engines:
          description: >-
            List of compliance nodes this Hyperscale job can run on, with id and
            name (Hyperscale only).
          type: array
          items:
            $ref: '#/components/schemas/Engine'
        discovery_policy_id:
          description: >-
            The id of the discovery policy in use - applicable for discovery
            jobs only.
          nullable: true
          type: string
        discovery_policy_name:
          description: >-
            The name of the discovery policy in use - applicable for discovery
            jobs only.
          nullable: true
          type: string
          example: ASDD Standard
        environment_name:
          description: >-
            The name of the environment in which this job resides on the
            compliance engine.
          type: string
          example: B2B Staging
        application_name:
          description: >-
            The name of the application associated with the environment in which
            this job resides on the compliance engine.
          type: string
          example: Custom B2B Solution
        account_id:
          description: >-
            The ID of the Account that created this ComplianceJob (Standard Job
            only).
          type: integer
          format: int64
          example: 1234
        account_name:
          description: >-
            The username of the Account that created this ComplianceJob
            (Standard Job only).
          type: string
          example: dsmith
        dct_managed:
          description: >-
            Whether or not this ComplianceJob is managed by DCT (Standard Job
            only).
          type: boolean
          example: false
        fail_immediately:
          description: >-
            Whether to fail immediately or delay failure until job completion
            when a masking algorithm fails to mask its data (Standard Job only).
          type: boolean
          default: false
          example: false
        batch_update:
          description: >-
            Whether the database load phase to output the masked data will be
            performed in batches. The size of the batches is determined by the
            field 'commit_size'. (Standard Job only).
          type: boolean
          default: true
          example: true
        commit_size:
          description: >-
            The size of the database commits when performing batch updates
            (Standard Job only).
          type: integer
          format: int32
          minimum: 1
          example: 100
        num_output_threads_per_stream:
          description: >-
            The amount of parallelism, per input stream, that the job uses to
            load back the masked data. For example, specifying 4 output threads
            per stream with 5 input streams results in a total of 20 output
            threads for the whole job. (Standard Job only).
          type: integer
          format: int32
          minimum: 1
          default: 1
          example: 10
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        job_orchestrator_id:
          type: string
          readOnly: true
        job_orchestrator_name:
          type: string
          readOnly: true
        reset_profiling_assignments:
          description: >-
            Determines whether the ruleset assignments for the previous
            profiling execution need to be cleared before this job gets
            executed.
          type: boolean
          example: true
        multiple_profiler_check:
          description: >-
            When enabled, assigns a default algorithm if multiple classifiers
            match across different data classes above the threshold.
          type: boolean
          example: true
        truncate_tables:
          description: >-
            Whether to truncate target database tables before loading masked
            data. Only applies to database on-the-fly masking jobs.
          type: boolean
          example: false
        drop_indexes:
          description: >-
            Whether to temporarily drop indexes prior to masking. This only
            applies to MySQL/MariaDB masking jobs. Other platforms should use
            enabled_tasks.
          type: boolean
          example: false
        enabled_tasks:
          description: >-
            Tasks to perform before/after a job from a set of available driver
            support tasks as indicated by the target rule-set's connector.
          type: array
          items:
            type: string
    CreateComplianceJobRequest:
      description: Parameters to create a compliance job.
      type: object
      required:
        - name
        - rule_set_id
        - type
      properties:
        name:
          description: The name of this compliance job.
          type: string
          example: My favorite ComplianceJob
        description:
          description: A description of the compliance job.
          type: string
          example: Job for app finance
        rule_set_id:
          description: The ID of the Rule Set used by this compliance job.
          type: string
          example: uuid
        type:
          description: The type of compliance job.
          type: string
          enum:
            - MASKING
            - DISCOVERY
            - TOKENIZATION
            - REIDENTIFICATION
          example: MASKING
        discovery_policy_id:
          description: >-
            The ID of the discovery policy to use for this compliance job. This
            is only applicable for DISCOVERY jobs.
          type: string
          example: uuid
        max_memory:
          description: >-
            The maximum amount of memory, in MB, that the compliance job can
            consume during execution. A value of 0 or omitting this field uses
            the default max memory set in application settings.
          type: integer
          format: int32
          minimum: 0
          example: 1024
        min_memory:
          description: >-
            The minimum amount of memory, in MB, that the compliance job can
            consume during execution. Omitting this field uses the default min
            memory set in application settings.
          type: integer
          format: int32
          minimum: 0
          example: 1024
        feedback_size:
          description: >-
            The granularity with which the system provides updates on the
            progress of the compliance job. For instance, a feedback size of
            50000 results in log updates whenever 50000 rows are processed
            during the masking phase.
          type: integer
          format: int32
          minimum: 1
          example: 50000
          default: 50000
        stream_row_limit:
          description: >-
            This value constrains the total number of rows that may enter the
            job for each masking stream. A value of 0 means unlimited. A value
            of -1 selects the default value. The minimum explicit value allowed
            is 20.
          type: integer
          format: int32
          minimum: -1
          example: 20000
        num_input_streams:
          description: >-
            This field controls the amount of parallelism that the masking job
            uses to extract out the data to be masked. For instance, when
            masking a database, specifying 5 input streams results in the
            compliance job reading up to 5 database tables in parallel and then
            masking those 5 streams of data in parallel. The higher the value of
            this field, the more potential parallelism there will be in the job,
            but the masking job will consume more memory. If the number of input
            streams exceeds the number of units being masked (e.g. tables or
            files), then the excess streams will do nothing.
          type: integer
          format: int32
          minimum: 1
          default: 1
          example: 4
        max_concurrent_source_connections:
          description: >-
            Maximum number of parallel connection that the Hyperscale instance
            can have with the source datasource (Hyperscale Job only).
          type: integer
          format: int32
          minimum: 1
          example: 32
        max_concurrent_target_connections:
          description: >-
            Maximum number of parallel connection that the Hyperscale instance
            can have with the target datasource (Hyperscale Job only).
          type: integer
          format: int32
          minimum: 1
          example: 32
        hyperscale_enabled:
          type: boolean
          example: true
          description: >-
            This flag indicates if this compliance job is enabled for Hyperscale
            processing.
        auto_calculate_unload_split:
          type: boolean
          example: true
          description: >-
            If set, hyperscale will auto calculate the no of splits required for
            masking job.
        consider_continuous_compliance_warning_event_as:
          type: string
          enum:
            - SUCCESS
            - FAILURE
          example: SUCCESS
          description: >-
            The flag to control behavior of Hyperscale Job execution on warning
            event in Continuous Compliance Job execution. Default behavior of
            Hyperscale Job on the WARNING status of Continuous Compliance Job
            execution, is to consider it as SUCCESS. One example of warning
            event in Continuous Compliance is masking non conformant data.
        create_all_indexes_with_nologging:
          type: boolean
          example: false
          description: Add all indexes with NOLOGGING as part of post load.
        disable_parallel_index_creation:
          type: boolean
          example: false
          description: >-
            Exclude indexes from combining with constraint and trigger groups as
            part of pre load.
        enable_all_constraints_with_novalidate:
          type: boolean
          example: false
          description: Enable all constraints with NOVALIDATE as part of post load.
        max_parallel_connections_per_table:
          type: integer
          minimum: 1
          maximum: 32767
          example: 10
          description: >-
            Maximum number of parallel connection that per table per masking
            job.
        max_records_per_split:
          type: integer
          format: int64
          minimum: 1
          example: 100000000
          description: Maximum number of rows allowed per split file for job execution.
        max_split_per_connection:
          type: integer
          minimum: 1
          maximum: 32767
          example: 4
          description: >-
            Maximum number of split files allowed per connection for job
            execution.
        parallelism_degree:
          description: >-
            The degree of parallelism (DOP) per Oracle job to recreate the index
            in the post-load process (Hyperscale Job only).
          type: integer
          format: int32
          minimum: -1
          maximum: 32767
          example: 4
        fail_immediately:
          description: >-
            Whether to fail immediately or delay failure until job completion
            when a masking algorithm fails to mask its data.
          type: boolean
          default: false
          example: false
        batch_update:
          description: >-
            Whether the database load phase to output the masked data will be
            performed in batches. The size of the batches is determined by the
            field 'commit_size'.
          type: boolean
          default: true
          example: true
        commit_size:
          description: >-
            The size of the database commits when performing batch updates.
            Omitting this field uses the default commit size set in application
            settings.
          type: integer
          format: int32
          minimum: 1
          example: 10000
        num_output_threads_per_stream:
          description: >-
            The amount of parallelism, per input stream, that the job uses to
            load back the masked data. For example, specifying 4 output threads
