          format: int64
          example: 5000
        bytes_masked:
          description: >-
            The number of bytes masked. This is only applicable for JSON file
            type.
          type: integer
          format: int64
          example: 500
        bytes_total:
          description: >-
            The total number of bytes. This is only applicable for JSON file
            type.
          type: integer
          format: int64
          example: 5000000
        duration:
          description: The time taken by the execution in ms.
          type: integer
          format: int64
          example: 5000000
