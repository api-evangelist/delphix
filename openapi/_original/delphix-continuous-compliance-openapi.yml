        Maximum number of objects to return per query. The value must be between
        1 and 1000. Default is 100.
      example: 50
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
    limitExtendedParam:
      name: limit
      in: query
      description: >-
        Maximum number of objects to return per query. The value must be between
        1 and 1000. Default is 10000.
      example: 100
      schema:
        type: integer
        minimum: 1
        maximum: 10000
        default: 10000
    cursor:
      name: cursor
      in: query
      description: >-
        Cursor to fetch the next or previous page of results. The value of this
        property must be extracted from the 'prev_cursor' or 'next_cursor'
        property of a PaginatedResponseMetadata which is contained in the
        response of list and search API endpoints.
