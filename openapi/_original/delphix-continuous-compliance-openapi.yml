          description: >-
            The expected status of the execution to cancel to prevent cancelling
            a queued job that has transitioned to a running state since the
            request was issued (Standard Job only).
          type: string
          enum:
            - QUEUED
            - RUNNING
          example: QUEUED
    ExecutionComponent:
      description: An execution component associated with a job execution
      type: object
      properties:
        id:
          description: The ID of the execution component
          type: string
          example: '123'
        name:
          description: The name of the execution component
          type: string
          example: table_a
        execution_id:
          description: The ID of the execution
          type: string
          example: 414ed52c-fa89-455d-9fb9-9c2fa5115f80
        status:
          $ref: '#/components/schemas/ExecutionStatus'
        rows_masked:
          description: >-
            The number of rows masked or profiled so far in the execution
            component. This is not applicable for JSON file type.
          type: integer
          format: int64
          example: 1000
        rows_total:
          description: >-
            The total number of rows that should be masked or profiled in the
            execution component. This value is set to -1 while the total row
            count is being calculated. This is not applicable for JSON file
            type.
          type: integer
          format: int64
          example: 5000
        bytes_processed:
          description: >-
            The number of bytes masked or profiled so far in the component. This
            is only applicable to JSON files and ASDD profiling jobs on XML
            files.
          type: integer
          format: int64
          example: 500
        bytes_total:
          description: >-
            The total number of bytes that should be masked or profiled in the
            component. This value is set to -1 while the total byte count is
            being calculated. This is only applicable to JSON files and ASDD
            profiling jobs on XML files.
          type: integer
          format: int64
          example: 5000000
        start_time:
          description: >-
            The date and time that the masking engine starts operating on the
            execution component.
          type: string
          format: date-time
          example: '2021-05-01T09:51:34.148000+00:00'
        end_time:
          description: >-
            The date and time that the execution component is placed in a final
            state.
          type: string
          format: date-time
          example: '2021-05-01T11:51:34.148000+00:00'
        non_conforming_data_count:
          description: The non-conforming data count for this execution component.
          type: integer
          format: int64
          example: 10
