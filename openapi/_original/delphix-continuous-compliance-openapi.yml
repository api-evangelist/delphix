        creation_date:
          description: The date this MaskingJob was created (Standard Job only).
          type: string
          format: date-time
          example: '2022-11-30T08:51:34.148000+00:00'
        last_completed_execution_date:
          description: The date this MaskingJob was last executed to completion.
          type: string
          format: date-time
          example: '2022-11-30T09:51:34.148000+00:00'
        last_execution_status:
          $ref: '#/components/schemas/ExecutionStatus'
        last_execution_id:
          description: The ID of this MaskingJob's last execution.
          type: string
          example: 00e38996-7da2-4827-8f3e-0503234de537
        connector_username:
          type: string
          description: >-
            The username of the Connector used by the MaskingJob (Standard Job
            only). For hyperscale jobs, see the connector of the dataset.
          nullable: true
          example: user123
        connector_password:
          x-dct-toolkit-credential-field: true
          type: string
          description: >-
            The password of the Connector used by the MaskingJob (Standard Job
            only). For hyperscale jobs, see the connector of the dataset.
          nullable: true
          example: '*****'
        on_the_fly_source_connector_username:
          type: string
          description: >-
            The username of the source Connector used by the on-the-fly
            MaskingJob (Standard Job only).
          nullable: true
          example: user123
        on_the_fly_source_connector_password:
          x-dct-toolkit-credential-field: true
          type: string
          description: >-
            The password of the source Connector used by the on-the-fly
            MaskingJob (Standard Job only).
          nullable: true
          example: '*****'
        job_type:
          type: string
          description: >-
            The engine type of this Job. This field is present for API backward
            compatibility.
          deprecated: true
          enum:
            - STANDARD
            - HYPERSCALE
          example: STANDARD
        hyperscale_instance_id:
          description: The ID of the Hyperscale instance of this Job (Hyperscale Job only).
          type: string
          example: abc
        description:
          description: Description of the Job (Hyperscale Job only).
          type: string
          example: Job for app finance
        dataset_id:
          description: Dataset of the Hyperscale Job (Hyperscale Job only).
          type: string
          example: dataset-123
        retain_execution_data:
          description: >-
            Defines whether execution data will be stored after execution is
            complete (Hyperscale Job only).
          type: string
          enum:
            - 'NO'
            - ON_ERROR
            - ALWAYS
          example: false
        max_memory:
          description: >-
            Maximum memory to be allocated for each Masking job (Hyperscale Job
            only).
          type: integer
          format: int32
          example: 1024
        min_memory:
          description: >-
            Minimum memory to be allocated for each Masking job (Hyperscale Job
            only).
          type: integer
          format: int32
          example: 1024
        feedback_size:
          description: Feedback Size for each Masking job (Hyperscale Job only).
          type: integer
          format: int32
          example: 32
        stream_row_limit:
          description: Stream Row Limit for each Masking job (Hyperscale Job only).
          type: integer
          format: int32
          example: 4
        num_input_streams:
          description: >-
            Number of input streams to be configured for Masking Job (Hyperscale
            Job only).
          type: integer
          format: int32
          example: 4
        max_concurrent_source_connections:
          description: >-
            Maximum number of parallel connection that the Hyperscale instance
            can have with the source datasource (Hyperscale Job only).
          type: integer
          format: int32
          example: 32
        max_concurrent_target_connections:
          description: >-
            Maximum number of parallel connection that the Hyperscale instance
            can have with the target datasource (Hyperscale Job only).
          type: integer
          format: int32
          example: 32
        parallelism_degree:
          description: >-
            The degree of parallelism (DOP) per Oracle job to recreate the index
            in the post-load process (Hyperscale Job only).
          type: integer
          format: int32
          example: 4
        source_masking_job_id:
          description: >-
            The ID of the MaskingJob that was used as the source to create this
            job (Hyperscale Job only).
          type: string
          example: masking-job-0
        engine_ids:
          description: List of engines that this job can run on (Hyperscale Job only).
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
    MaskingExecutionMetrics:
      description: Metrics for a masking job.
      type: object
      properties:
        id:
          description: The MaskingJob entity ID.
          type: string
          example: masking-job-1
        masking_job_name:
          description: The name of the MaskingJob.
          type: string
          example: My favorite MaskingJob
        masking_job_type:
          type: string
          description: The type of the Masking job.
          enum:
            - STANDARD
            - HYPERSCALE
          example: STANDARD
        connector_type:
