        name:
          type: string
          description: The name of the discovery expression.
          example: my expression
        regular_expression:
          type: string
          description: >-
            The regular expression that will be used to match against
            column/field names or data values during the execution of a
            discovery job. Only applicable for SEARCH expressions.
          example: .*
        data_level_profiling:
          type: boolean
          description: >-
            This field determines whether the discovery expression will be
            targeted at the underlying data in a data source (e.g. row values in
            the database column / field values in the file), or whether the
            discovery expression will be targeted at the schema of the data
            source (e.g. column names in a database table or field names in a
            file). Data-Level profiling consumes more memory than
            Column-Name-Level/Field-Name-Level profiling due to the fact that
            the discovery expression must be checked against a larger number of
            data values (e.g. hundreds) than column/field names (i.e. one). Only
            applicable for SEARCH expressions.
          example: true
