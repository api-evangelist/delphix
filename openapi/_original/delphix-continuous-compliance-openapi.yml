            The purpose of this MaskingEnvironment. MaskingEnvironments with a
            'MASK' purpose will have access to Masking and Profiling jobs,
            whereas Environments with a 'TOKENIZE' purpose will have access to
            Tokenization and Re-Identification jobs. Note that any custom
            purposes created through the UI will be represented as 'MASK'
            purposes, due to the jobs that they have access to.
          enum:
            - MASK
            - TOKENIZE
          type: string
        is_workflow_enabled:
          type: boolean
