  schemas:
    AlgorithmField:
      description: The algorithm field details for a multi-column/multi-condition algorithm
      type: object
      properties:
        id:
          description: The id of the algorithm field.
          type: string
          example: 20b4692e-381d-40a0-a46e-0ba7658acaf3
          readOnly: true
        name:
          description: The name of the algorithm field.
          type: string
          example: ADDRESS_LINE1
          readOnly: true
        type:
          description: The type of algorithm field.
          type: string
          enum:
            - BIG_DECIMAL
            - LOCAL_DATE_TIME
            - STRING
            - BYTE_BUFFER
          example: STRING
          readOnly: true
        is_read_only:
          description: >-
            Indicates whether the field is read-only. Read-only fields are taken
            as input by the masking algorithm but not masked.
          type: boolean
          readOnly: true
        is_optional:
          description: >-
            Indicates whether the field is optional. Optional fields do not have
            to be assigned to a real data field or column in order for a masking
            assignment to be considered valid.
          type: boolean
          readOnly: true
        description:
          description: The description of the algorithm field.
          type: string
          readOnly: true
    Job:
      description: An asynchronous task.
      type: object
      properties:
        id:
          description: The Job entity ID.
          type: string
          example: job-123
        status:
          description: The status of the job.
          type: string
          enum:
            - PENDING
            - STARTED
            - TIMEDOUT
            - RUNNING
            - CANCELED
            - FAILED
            - SUSPENDED
            - WAITING
            - COMPLETED
            - ABANDONED
          example: RUNNING
        is_waiting_for_telemetry:
          description: >-
            Indicates that the operations performed by this Job have completed
            successfully, but the object changes are not yet reflected. This is
            only set when when the JOB is in STARTED status, with the guarantee
            that the job will not transition to the FAILED status. Note that
            this flag will likely be replaced with a new status in future API
            versions and be deprecated.
          type: boolean
        type:
          description: The type of job being done.
          type: string
          example: DB_REFRESH
        localized_type:
          description: The i18n translated type of job being done.
          type: string
          example: DB Refresh
        error_details:
          description: Details about the failure for FAILED jobs.
          type: string
          example: Unable to connect to the engine.
        warning_message:
          description: Warnings for the job.
          type: string
          example: 'Failed to remove local MaskingJob, engineId: 3 localMaskingJobId: 7.'
        target_id:
          description: A reference to the job's target.
          type: string
          example: vdb-123
        target_name:
          description: A reference to the job's target name.
          type: string
          example: vdb
        start_time:
          description: The time the job started executing.
          type: string
          format: date-time
          example: '2022-01-02T05:11:24.148000+00:00'
        update_time:
          description: The time the job was last updated.
          type: string
          format: date-time
          example: '2022-01-02T06:11:24.148000+00:00'
        trace_id:
          description: traceId of the request which created this Job
          type: string
        engine_ids:
          description: IDs of the engines this Job is executing on.
          type: array
          items:
            type: string
          deprecated: true
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        engines:
          type: array
          items:
            $ref: '#/components/schemas/Engine'
        account_id:
          description: The ID of the account who initiated this job.
          type: integer
          example: 1
        account_name:
          description: >-
            The account name which initiated this job. It can be either
            firstname and lastname combination or firstname or lastname or
            username or email address or Account-<id>.
          type: string
          example: User 1
        compliance_node_id:
          type: string
          description: The ID of the associated compliance node, if applicable.
          nullable: true
        compliance_node_name:
          type: string
          description: The name of the associated compliance node, if applicable.
          nullable: true
        percent_complete:
          description: Completion percentage of the Job.
          type: integer
          minimum: 0
          maximum: 100
          example: '50'
        virtualization_tasks:
          deprecated: true
          type: array
          items:
            $ref: '#/components/schemas/VirtualizationTask'
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/JobTask'
        execution_id:
          description: The ID of the associated masking execution, if any.
          type: string
          nullable: true
        result_type:
          description: >-
            The type of the job result. This is the type of the object present
            in the result.
          type: string
        result:
          description: >-
            The result of the job execution. This is JSON serialized string of
            the result object whose type is specified by result_type property.
          type: object
    ComplianceApplicationSetting:
      title: ComplianceApplicationSetting
      type: object
      description: An application setting of a compliance engine.
      properties:
        id:
          description: The ID of the application setting.
          type: string
          example: 5835c60d-2155-1234-8c54-b4dff23d89c5
        group:
          description: The group of the application setting.
          type: string
          example: general
        name:
          description: The name of the application setting.
          type: string
          example: PasswordResetLinkDuration
        value:
          description: The value of the application setting.
          type: string
          example: '5'
        value_type:
          description: The type of the value of the application setting.
          type: string
          enum:
            - string
            - number
            - boolean
            - regular-expression
          example: number
    ComplianceApplicationSettingUpdateRequest:
      title: ComplianceApplicationSettingUpdateRequest
      type: object
      description: Request to update an application setting value.
      required:
        - setting_value
      properties:
        setting_value:
          description: The new value for the application setting.
          type: string
          example: '10'
    MaskingJobWithConnectorRole:
      description: >-
        A simplified job object combined with a connector ID and the connector's
        role in that job
      type: object
      properties:
        id:
          description: The Job entity ID.
          type: string
          example: job-123
        name:
          description: The name of this Masking Job.
          type: string
          example: My favorite MaskingJob
        creation_date:
          description: The date this MaskingJob was created.
          type: string
          format: date-time
          example: '2022-11-30T08:51:34.148000+00:00'
        is_on_the_fly_masking:
          description: Whether the job is an on-the-fly masking job
          type: boolean
        last_execution_time:
          description: >-
            The start time of the most recent execution of this job, if
            available
          type: string
          format: date-time
        last_execution_status:
          $ref: '#/components/schemas/ExecutionStatus'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        connector_id:
          description: The ID of the connector this job is related to
          type: string
          nullable: true
        connector_role:
          description: The role of the connector in the job
          type: string
          enum:
            - SOURCE
            - TARGET
          nullable: false
    VirtualizationTask:
      deprecated: true
      properties:
        id:
          type: string
        parent_job_id:
          type: string
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
