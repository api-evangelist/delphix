    ConnectorTestRequest:
      x-jackson-optional-nullable-helpers: true
      title: ConnectorTestRequest
      type: object
      description: The details of the connector to be tested.
      properties:
        database_type:
          description: >-
            The database variant. Currently supports [DB2, DB2_ISERIES,
            DB2_MAINFRAME, ORACLE, MSSQL, MYSQL, MARIADB, POSTGRES,
            AURORA_POSTGRES, COCKROACHDB_POSTGRES, RDS_POSTGRES,
            YUGABYTEDB_POSTGRES, SYBASE].
          type: string
          enum:
            - DB2
            - DB2_ISERIES
            - DB2_MAINFRAME
            - ORACLE
            - MSSQL
            - MYSQL
            - MARIADB
            - POSTGRES
            - AURORA_POSTGRES
            - COCKROACHDB_POSTGRES
            - RDS_POSTGRES
            - YUGABYTEDB_POSTGRES
            - SYBASE
          example: ORACLE
          nullable: true
          x-is-jackson-optional-nullable: true
        hostname:
          description: The network hostname or IP address of the database server.
          type: string
          example: database_server.mycompany.co
          nullable: true
          x-is-jackson-optional-nullable: true
        port:
          description: The TCP port of the server.
          type: integer
          format: int32
          minimum: 1
          maximum: 65535
          example: 9100
          nullable: true
          x-is-jackson-optional-nullable: true
        username:
          description: The username this Connector will use to connect to the database.
          type: string
          example: my_username
        password:
          x-dct-toolkit-credential-field: true
          description: The password this Connector will use to connect to the database.
          type: string
          example: my_password
        jdbc_url:
          description: The jdbc URL for this connector
          type: string
          example: jdbc:oracle:thin:@//localhost:1521/ORCL
          nullable: true
          x-is-jackson-optional-nullable: true
        schema_name:
          description: The schema name for this connector
          type: string
          example: public
        sid:
          description: >-
            The SID value for this connector. This field is specific to Oracle
            database connectors
          type: string
          example: ORCL
          nullable: true
          x-is-jackson-optional-nullable: true
        database_name:
          description: >-
            The name of the database to connect to. This field is not valid for
            database types 'ORACLE'.
          type: string
          example: my_database
          nullable: true
          x-is-jackson-optional-nullable: true
        instance_name:
          description: >-
            The name of the database instance. Only used for database type
            'MSSQL'.
          type: string
          example: SQL2016
          nullable: true
          x-is-jackson-optional-nullable: true
        job_orchestrator_id:
          description: >-
            The ID or name of the job orchestrator that is associated with this
            connector.
          type: string
        file_reference_id:
          description: >-
            The reference uri/id of the connection-properties file used by the
            connector.
          type: string
