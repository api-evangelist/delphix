        - connector_id
      properties:
        name:
          description: The name of this rule set.
          type: string
        connector_id:
          description: The ID of the connector this rule set uses.
          type: string
        refresh_drops_tables:
          description: >-
            This applies when table metadata exists in DCT, but the
            corresponding table no longer exists in the external database. In
            that event, true will cause the refresh operation to delete the
            invalid table metadata, whereas false will fail the refresh instead.
          type: boolean
          default: false
        make_current_account_owner:
          description: >-
            Whether the account creating this rule set must be configured as
            owner of it.
          type: boolean
          default: true
        tags:
          description: The tags for this rule set.
          type: array
          items:
            $ref: '#/components/schemas/Tag'
    RuleSetUpdateRequest:
      description: Parameters used to update a rule set.
      type: object
      properties:
        name:
          description: The name of this rule set.
          type: string
        refresh_drops_tables:
          description: >-
            This applies when table metadata exists in DCT, but the
            corresponding table no longer exists in the external database. In
            that event, true will cause the refresh operation to delete the
            invalid table metadata, whereas false will fail the refresh instead.
          type: boolean
    RuleSetBulkTableDeltaUpdateRequest:
      description: >-
        The mutually exclusive list of tables to be added, modified, or removed
        from the ruleset must be provided in three different arrays. Note that
        only the delta needs to be provided, and existing tables not listed here
        will be left unchanged.
      type: object
      properties:
        add:
          description: Tables to add to the rule set.
          type: array
          items:
            $ref: '#/components/schemas/DatabaseTableMetadataParameters'
        update:
          description: >-
            Tables to update in the rule set. Any
            DatabaseTableMetadataParameters properties not provided will be set
            to null.
          type: array
          items:
            $ref: '#/components/schemas/DatabaseTableMetadataParameters'
        delete:
          description: Tables to delete from the rule set.
          type: array
          items:
            $ref: '#/components/schemas/DatabaseTableMetadataParameters'
    MaskingEnvironment:
      properties:
        id:
          description: The MaskingEnvironment entity ID.
          type: string
