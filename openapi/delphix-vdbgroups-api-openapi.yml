          example: '1'
        replica_engine_name:
          description: The name of the replicated object's engine.
          type: string
          example: replica-e1
        replica_namespace_id:
          description: The namespace id of the replicated object.
          type: string
          example: namespace-1
    OracleRacCustomEnvFile:
      type: object
      properties:
        node_id:
          type: string
          minLength: 1
          maxLength: 256
        path_parameters:
          type: string
    VirtualizationTask:
      deprecated: true
      properties:
        id:
          type: string
        parent_job_id:
          type: string
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        title:
          type: string
        percent_complete:
          type: integer
          minimum: 0
          maximum: 100
        events:
          type: array
          items:
            $ref: '#/components/schemas/VirtualizationTaskEvent'
        status:
          type: string
          enum:
          - PENDING
          - STARTED
