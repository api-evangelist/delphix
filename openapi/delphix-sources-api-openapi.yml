          - (ADDRESS=(PROTOCOL=tcp)(HOST=10.75.59.184)(PORT=4567))
        is_discovered:
          description: Whether this listener was automatically discovered or not.
          type: boolean
        host_id:
          description: Id to the host this listener is associated with.
          type: string
          example: 1-UNIX_HOST-14
    OracleRACDatabaseInstance:
      type: object
      required:
      - instance_name
      - instance_number
      - node_reference
      properties:
        instance_name:
          type: string
          description: The name of this instance. Must contain at least one non-whitespace character.
          minLength: 1
          pattern: .*\S.*
        instance_number:
          type: integer
          description: The number of this instance.
          minimum: 1
        node_reference:
          type: string
          description: The reference to the cluster node which the instance is running on. Must contain at least one non-whitespace character.
          minLength: 1
          pattern: .*\S.*
        okv_client_id:
          description: The id of the OKV client used for TDE keystore access. If provided, it must include at least one non-whitespace character; if omitted, the existing OKV client will be cleared.
          type: string
          minLength: 1
          pattern: .*\S.*
          example: 1-ORACLE_OKV_CLIENT-1
    Error:
      type: object
      properties:
        message:
          type: string
          readOnly: true
          description: Message providing more detail about the error that occurred, if available.
        object_name:
          type: string
          readOnly: true
          description: Name of the object affected by the error.
    ConnectivityCheckResponse:
      title: ConnectivityResponse
      type: object
      description: The result of the connectivity check.
      required:
      - message
      properties:
        message:
          description: A message describing the result of the connectivity check.
          type: string
          example: Success!
        status:
          description: A status describing the status of the connectivity check.
          type: string
          enum:
          - SUCCESS
          - FAILED
          example: SUCCESS
    UpdateSourceParameters:
      deprecated: true
      type: object
      description: Parameters to update a Source.
      properties:
        oracle_services:
          type: array
          items:
            type: string
          description: List of jdbc connection strings which are used to connect with the database.
          example:
          - jdbc:oracle:thin:@hostname:port/service_name
          - jdbc:oracle:thin:@hostname:port:SID
    OracleService:
      properties:
        discovered:
          description: Represents whether this jdbc connection string is auto discovered or not.
          type: boolean
        jdbc_connection_string:
          description: The jdbc connection string used to connect with the database.
          type: string
          example: jdbc:oracle:thin:@(DESCRIPTION=(ENABLE=broken)(ADDRESS=(PROTOCOL=tcp)(HOST=10.110.230.197)(PORT=1521))(CONNECT_DATA=(UR=A)(SERVICE_NAME=VDBOMSRBBDC6C_UJG)))
    Errors:
      description: Sadly, sometimes requests to the API are not successful. Failures can occur for a wide range of reasons. The Errors object contains information about full or partial failures which might have occurred during the request.
      type: array
      items:
        $ref: '#/components/schemas/Error'
    SearchBody:
      description: Search body.
      type: object
      properties:
        filter_expression:
          type: string
          minLength: 5
          maxLength: 50000
          example: string_field CONTAINS "over" AND numberic_field GT 9000 OR string_field2 EQ "Goku"
    Repository:
      properties:
        id:
          description: Entity id of the repository.
          type: string
        name:
          description: Name of the repository.
          type: string
        database_type:
          description: The database type of this repository.
          type: string
        allow_provisioning:
          description: Flag indicating whether the repository should be used for provisioning.
          type: boolean
        is_staging:
          description: Flag indicating whether this repository can be used by the Delphix Engine for internal processing.
          type: boolean
        oracle_base:
          description: The Oracle base where database binaries are located.
          type: string
        version:
          description: Version of the repository.
          type: string
        bits:
          description: 32 or 64 bits.
          type: integer
        install_group:
          description: Group name of the user that owns the install.
          type: string
        install_user:
          description: User name of the user that owns the install.
          type: string
        rac:
          description: Flag indicating whether the install supports Oracle RAC.
          type: boolean
        ports:
          description: The network ports for connecting to the database instance.
          type: array
          items:
            type: integer
            format: int64
        port:
          description: The network port for connecting to the SQL Server instance.
          type: integer
          format: int64
        dump_history_file:
          description: Fully qualified name of the dump history file.
          type: string
        page_size:
          description: Database page size for the SAP ASE instance.
          type: integer
          format: int64
        owner:
          description: Account the database server instance is running as.
          type: string
        installation_path:
          description: Directory path where the installation is located.
          type: string
        fulltext_installed:
          description: This property determines if the full-text search and semantic search is installed or not.
          type: boolean
        internal_version:
          description: The internal version is tied to the data format of a database and is used to detect compatibility.
          type: integer
          format: int64
        mssql_cluster_instances_name:
          description: MSSQL cluster instances name.
          type: array
          items:
            type: string
        mssql_cluster_instances_version:
          description: MSSQL cluster instances version.
          type: array
          items:
            type: string
        mssql_cluster_instances_owners:
          description: MSSQL cluster instance owners.
          type: array
          items:
            type: string
        mssql_cluster_instances_ports:
          description: MSSQL cluster instances ports.
          type: array
          items:
            type: integer
            format: int64
        mssql_cluster_instances_server_names:
          description: MSSQL cluster instances server names.
          type: array
          items:
            type: string
        mssql_cluster_instances_nodes:
          description: MSSQL cluster instances nodes.
          type: array
          items:
            type: string
        installation_home:
          description: Directory where the installation home is located.
          type: string
        drive_letter:
          description: MSSQL failover cluster drive letter.
          type: array
          items:
            type: string
        discovered:
          description: Flag indicating whether the repository was automatically discovered.
          readOnly: true
          type: boolean
        mssql_listeners:
          description: The list of listeners belonging to this repository.
          type: array
          items:
            $ref: '#/components/schemas/MSSQLClusterListener'
        database_username:
          type: string
          description: The username of the ASE instance database.
        service_principal_name:
          type: string
          description: The Kerberos Service Principal Name (SPN) of the database.
        isql_path:
          type: string
          description: The path to the isql binary to use for this SAP ASE instance.
        ase_tls_enabled:
          description: True if SAP ASE instance is TLS/SSL enabled.
          type: boolean
        credential_type:
          description: The credential type used for this repository.
          type: string
          enum:
          - PasswordCredential
          - SystemKeyCredential
          - KeyPairCredential
          - KerberosCredential
          - CyberArkVaultCredential
          - HashiCorpVaultCredential
          - AzureVaultCredential
        toolkit_id:
          description: The ID of the toolkit associated with this repository(AppData only).
          type: string
      discriminator:
        propertyName: class_type
    VirtualizationTask:
      deprecated: true
      properties:
        id:
          type: string
        parent_job_id:
          type: string
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        title:
          type: string
        percent_complete:
          type: integer
          minimum: 0
          maximum: 100
        events:
          type: array
          items:
