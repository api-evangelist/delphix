        - id
        - -id
        - database_type
        - -database_type
        - name
        - -name
        - database_version
        - -database_version
        - environment_id
        - -environment_id
        - data_uuid
        - -data_uuid
        - ip_address
        - -ip_address
        - fqdn
        - -fqdn
        - size
        - -size
        - jdbc_connection_string
        - -jdbc_connection_string
        - plugin_version
        - -plugin_version
        - is_dsource
        - -is_dsource
        - instance_name
        - -instance_name
        - instance_number
        - -instance_number
        - user
        - -user
        - non_sys_user
        - -non_sys_user
        - discovered
        - -discovered
        - linking_enabled
        - -linking_enabled
        - repository
        - -repository
        - cdb_type
        - -cdb_type
        - environment_user_ref
        - -environment_user_ref
        - data_connection_id
        - -data_connection_id
        - database_name
        - -database_name
        - database_unique_name
        - -database_unique_name
        nullable: true
        example: name
    sourceIdParam:
      in: path
      name: sourceId
      required: true
      schema:
        type: string
        minLength: 1
      description: The ID of the Source.
    limit:
      name: limit
      in: query
      description: Maximum number of objects to return per query. The value must be between 1 and 1000. Default is 100.
      example: 50
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
    cursor:
      name: cursor
      in: query
      description: Cursor to fetch the next or previous page of results. The value of this property must be extracted from the 'prev_cursor' or 'next_cursor' property of a PaginatedResponseMetadata which is contained in the response of list and search API endpoints.
      schema:
        type: string
        minLength: 1
        maxLength: 4096
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
